.tbl{overflow-x:auto}

.chk{display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer}.chk input{width:18px;height:18px;accent-color:var(--acc)}

.tabs{display:none}.nav,.nav *{-webkit-tap-highlight-color:transparent;user-select:none}.ni{display:grid;place-items:center;width:34px;height:26px;border-radius:13px;flex:none;font-style:normal}.ni svg{width:20px;height:20px}

.lock{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mut)}

.show-m{display:none}.mono{font-family:ui-monospace,Menlo,monospace}

.pre{display:flex;gap:6px;flex-wrap:wrap}.upd{font-size:12px;color:var(--mut)}
@media(max-width:820px){.hide-m{display:none}.show-m{display:block}.hero h1{font-size:19px}}

.kc{display:flex;flex-direction:column;gap:10px;min-height:calc(100dvh - 300px)}.kmsg{display:flex;flex-direction:column;gap:12px}
.kb{max-width:min(640px,92%);padding:11px 14px;border-radius:16px;font-size:14.5px;line-height:1.5;word-break:break-word}.kb.u{align-self:flex-end;background:var(--acc);color:#fff;border-bottom-right-radius:5px}.kb.a{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}

.tg{display:inline-block;padding:1px 8px;border-radius:99px;background:var(--acc2);color:var(--acc);font-size:11px;font-weight:600;margin:3px 4px 0 0}
.tk textarea,.fm textarea{width:100%;min-height:80px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px;font:inherit;font-size:16px;resize:vertical}
.pick{max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:6px 10px;margin-top:8px}
.sw{position:relative;width:46px;height:28px;flex:none}.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}.sw i{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.15s}.sw i:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.15s}.sw input:checked+i{background:var(--ok)}.sw input:checked+i:after{left:21px}
.big{font-size:30px;font-weight:700;letter-spacing:-.02em}

  if (a === 'modadd') { const root = $('#modnew'); const r = await api('mod_add', { email: $('#mn-em').value, perms: readPerms(root) }); toast(r.ok ? 'Moderatör eklendi.' : r.error); if (r.ok) loadPage(); return; }
  if (a === 'modsave') { const r = await api('mod_update', { user_id: t.dataset.id, perms: readPerms(t.closest('[data-uid]')) }); toast(r.ok ? 'Yetkiler kaydedildi.' : r.error); return; }
  if (a === 'modact') { const r = await api('mod_update', { user_id: t.dataset.id, active: t.dataset.on === '1' }); toast(r.ok ? 'Güncellendi.' : r.error); if (r.ok) loadPage(); return; }
  if (a === 'modrm') { if (t.dataset.sure !== '1') { t.dataset.sure = '1'; t.textContent = 'Emin misin? Tekrar bas'; return; } const r = await api('mod_remove', { user_id: t.dataset.id }); toast(r.ok ? 'Moderatör kaldırıldı.' : r.error); if (r.ok) loadPage(); return; }
});

  if (e.target.id === 'q') { S.q = e.target.value; const r0 = S.d.businesses; const el = $('#blist'); if (r0 && el) el.innerHTML = bList(r0.rows); }
  if (e.target.id === 'eq') { S.eq = e.target.value; const r0 = S.d.errors; const el = $('#elist'); if (r0 && el) el.innerHTML = eList(r0.groups.filter((g) => !S.eq || g.msg.toLowerCase().includes(S.eq.toLowerCase()))); }
});

  if (e.target.id === 'bs') { S.bs = e.target.value; const r0 = S.d.businesses; const el = $('#blist'); if (r0 && el) el.innerHTML = bList(r0.rows); } });
document.addEventListener('keydown', (e) => { if (e.key === 'Enter') { if ($('#code')) mfaVerify(); else if ($('#pw')) doAuth(!!document.querySelector('[data-a=signup]')); } });

setInterval(() => { if (!S.admin || document.hidden || S.drawer || (S.view !== 'overview' && S.view !== 'errors')) return; if (/INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || '')) return; loadPage(); }, 60000);
