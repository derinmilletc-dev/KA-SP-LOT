<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>KaisPilot</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preload" as="image" href="/login-hero.jpg">
<meta name="theme-color" content="#12213B">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"></noscript>
<style>/* Yerleşim fikri: telefonda alt sekme çubuğu, geniş ekranda sol menü. Defter satırı gibi okunan listeler, İznik çinisinden gelen mavi ve geometrik desen. */
:root{
  --ink:#12213B;
  --ink-2:#3B4A63;
  --muted:#66738A;
  --canvas:#F2F5F9;
  --surface:#FFFFFF;
  --line:#DCE3EC;
  --cini:#0D56A6;
  --cini-d:#093F7A;
  --cini-wash:#E5EFFA;
  --turq:#17A2A0;
  --nar:#C23A4D;
  --nar-wash:#FBEAED;
  --safran:#8F5E0B;
  --safran-wash:#FBF1DC;
  --yesil:#1F7753;
  --yesil-wash:#E2F3EA;
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--canvas);color:var(--ink);font:400 15px/1.5 var(--font-body);color-scheme:light;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em;font-weight:650;line-height:1.2}
h2{font-size:22px}
h3{font-size:17px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--cini)}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--turq);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.ic{flex:none}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-lg{display:flex;flex-direction:column;gap:20px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.right{text-align:right}

/* kabuk */
.shell{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr)}
.side{display:none}
.col{min-width:0}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.top .mark{display:inline-flex;color:var(--cini)}
.ptitle{font-size:19px}
.biz{display:none;font-size:13px;color:var(--muted)}
.avatar{width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;font:600 13px var(--font-display);color:#fff;border:0;flex:none}
.main{padding:16px 16px 100px;max-width:1040px;width:100%;margin:0 auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;padding:6px 2px;font-size:11.5px;color:var(--muted);min-height:50px;border-radius:10px}
.tab[aria-current=page]{color:var(--cini);font-weight:600}
.brand{display:flex;align-items:center;gap:10px;font:700 21px var(--font-display);color:var(--ink)}
.brand svg{color:var(--cini)}
@media(min-width:900px){
  .shell{grid-template-columns:248px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;gap:20px;padding:20px 14px;background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh}
  .side nav{display:flex;flex-direction:column;gap:2px}
  .side .nav{display:flex;align-items:center;gap:12px;border:0;background:transparent;padding:10px 12px;border-radius:10px;color:var(--ink-2);font-weight:500;text-align:left;min-height:44px}
  .side .nav:hover{background:var(--canvas)}
  .side .nav[aria-current=page]{background:var(--cini-wash);color:var(--cini)}
  .side .me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid var(--line)}
  .tabbar{display:none}
  .top .mark,.top .avatar{display:none}
  .biz{display:block;margin-left:auto}
  .main{padding:24px 28px 40px}
}

/* bileşenler */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.card.flush{padding:0;overflow:hidden}
.card h3+.muted{margin-top:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid transparent;background:var(--cini);color:#fff;font-weight:500;text-decoration:none}
.btn:hover{background:var(--cini-d)}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.sec:hover{background:var(--canvas)}
.btn.ghost{background:transparent;color:var(--cini)}
.btn.ghost:hover{background:var(--cini-wash)}
.btn.bad{background:var(--nar)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:500;white-space:nowrap}
.p-ok{background:var(--yesil-wash);color:var(--yesil)}
.p-warn{background:var(--safran-wash);color:var(--safran)}
.p-bad{background:var(--nar-wash);color:var(--nar)}
.p-info{background:var(--cini-wash);color:var(--cini)}
.p-mute{background:#E9EDF3;color:var(--ink-2)}
.seg{display:inline-flex;background:#E6EBF2;border-radius:10px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:8px;min-height:38px;color:var(--ink-2);font-weight:500;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--cini);box-shadow:0 1px 2px rgba(18,33,59,.14)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;min-height:36px;font-size:14px;color:var(--ink-2)}
.chip[aria-pressed=true]{background:var(--cini);border-color:var(--cini);color:#fff}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:13.5px;font-weight:500;color:var(--ink-2)}
input[type=text],input[type=email],input[type=password],input[type=number],select,textarea{width:100%;min-height:44px;border:1px solid #C7D0DD;border-radius:10px;padding:10px 12px;font:inherit;background:#fff;color:var(--ink)}
textarea{min-height:88px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--cini)}
.err{color:var(--nar);font-size:13.5px;min-height:20px}
.callout{display:flex;gap:10px;padding:12px 14px;border-radius:12px;background:var(--cini-wash);color:var(--ink);font-size:14px}
.callout.warn{background:var(--safran-wash)}
.callout .ic{margin-top:2px;color:var(--cini)}
.callout.warn .ic{color:var(--safran)}
.section-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* yapılacaklar */
.todo{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-height:68px}
.todo:hover{border-color:#B9C6D8}
.todo .dot{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.todo b{display:block;font-weight:600}
.todo .sub{color:var(--muted);font-size:13.5px}
.tone-bad{background:var(--nar-wash);color:var(--nar)}
.tone-warn{background:var(--safran-wash);color:var(--safran)}
.tone-info{background:var(--cini-wash);color:var(--cini)}
.tone-ok{background:var(--yesil-wash);color:var(--yesil)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{padding:12px;border-radius:12px;background:var(--canvas)}
.kpi .v{font:650 17px var(--font-display);margin-top:2px}
.kpi .l{font-size:12.5px;color:var(--muted)}

/* defter satırı */
.ledger{padding:0 16px}
.lrow{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:6px 12px;padding:13px 0 13px 12px;border-top:1px solid var(--line);border-left:3px solid transparent;margin-left:-16px;padding-left:25px}
.lrow:first-child{border-top:0}
.lrow.s-eksik{border-left-color:var(--nar)}
.lrow.s-belgesiz{border-left-color:#D9A441}
.lrow.s-eslesti{border-left-color:var(--yesil)}
.lrow .ld{color:var(--muted);font-size:13px;padding-top:2px}
.lrow .lt{font-weight:500;overflow-wrap:anywhere}
.lrow .lamt{font-weight:600;text-align:right;white-space:nowrap}
.lrow .lamt.in{color:var(--yesil)}
.lrow .lfoot{grid-column:2 / 4;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;padding:14px 16px;border-top:1px solid var(--line)}
.rrow:first-child{border-top:0}
.rrow .rfoot{grid-column:1 / 3;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rrow select{min-height:36px;width:auto;padding:4px 10px;font-size:14px}

/* ekip */
.emp{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}
.emp:first-child{border-top:0}
.emp .meta{grid-column:2 / 4;color:var(--muted);font-size:13.5px}
.emp .act{grid-column:2 / 4;display:flex;gap:8px;flex-wrap:wrap}
.clock{text-align:center;padding:24px 16px}
.clock .state{font:650 28px var(--font-display);margin:6px 0 2px}
.timer{font:650 52px var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.timer.over{color:var(--nar)}
.logline{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.logline:first-child{border-top:0}

/* sıralama */
.rk{border-top:1px solid var(--line)}
.rk:first-child{border-top:0}
.rk summary{list-style:none;display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:14px 16px;cursor:pointer;min-height:64px}
.rk summary::-webkit-details-marker{display:none}
.rk .pos{font:650 20px var(--font-display);color:var(--cini)}
.rk .bar{grid-column:2 / 4;height:8px;border-radius:99px;background:#E6EBF2;overflow:hidden}
.rk .bar i{display:block;height:100%;background:var(--cini);border-radius:99px}
.rk .score{font:650 20px var(--font-display);text-align:right}
.rk .body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-weight:500;color:var(--muted);text-align:left;padding:6px 6px 6px 0;font-size:13px}
.tbl td{padding:8px 6px 8px 0;border-top:1px solid var(--line)}
.tbl td.r,.tbl th.r{text-align:right;padding-right:0;padding-left:14px;white-space:nowrap}
.tbl th,.tbl td{padding-right:10px}
.tbl th{white-space:nowrap}
.tblwrap{overflow-x:auto}
.weights{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.weights .wl{display:flex;justify-content:space-between;font-size:14px}
@media(min-width:700px){.weights{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* duyuru ve stok */
.msg{padding:16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.msg:first-child{border-top:0}
.msg .mh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.who{display:flex;gap:6px;flex-wrap:wrap}
.stk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}
.stk:first-child{border-top:0}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.stepper b{min-width:44px;text-align:center;font:650 17px var(--font-display);font-variant-numeric:tabular-nums}
.minibar{height:6px;border-radius:99px;background:#E6EBF2;overflow:hidden;margin-top:6px;max-width:220px}
.minibar i{display:block;height:100%;border-radius:99px}
.csv{font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;min-height:150px;white-space:pre;overflow:auto}
.check{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.check:first-child{border-top:0}
.check .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none}
.client{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-height:72px}
.client[aria-pressed=true]{border-color:var(--cini);box-shadow:0 0 0 1px var(--cini)}
.prog{height:8px;border-radius:99px;background:#E6EBF2;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--turq);border-radius:99px}
.toggle{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.toggle:first-child{border-top:0}
.sw{width:46px;height:28px;border-radius:99px;border:0;background:#C7D0DD;position:relative;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-checked=true]{background:var(--cini)}
.sw[aria-checked=true]::after{transform:translateX(18px)}

/* modal ve bildirim */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(18,33,59,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:520px;padding:20px 20px calc(20px + env(safe-area-inset-bottom));max-height:92%;overflow:auto;display:flex;flex-direction:column;gap:14px}
.sheet .sh{display:flex;justify-content:space-between;align-items:center;gap:12px}
.xbtn{width:40px;height:40px;border-radius:10px;border:0;background:var(--canvas);display:grid;place-items:center}
.drop{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:28px 16px;border:2px dashed #B9C6D8;border-radius:14px;color:var(--cini);cursor:pointer;background:var(--cini-wash)}
.drop b{color:var(--ink)}
.spin{width:34px;height:34px;border-radius:50%;border:4px solid var(--cini-wash);border-top-color:var(--cini);animation:spin .9s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.conf{height:8px;border-radius:99px;background:#E6EBF2;overflow:hidden}
.conf i{display:block;height:100%;background:var(--yesil);border-radius:99px}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 12px;font-size:14.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500}
#toasts{position:fixed;left:0;right:0;bottom:84px;z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-size:14.5px;max-width:420px;box-shadow:0 6px 20px rgba(18,33,59,.25)}
.toast.bad{background:var(--nar)}
.toast.warn{background:var(--safran)}
@media(min-width:900px){#toasts{bottom:24px}.overlay{align-items:center}.sheet{border-radius:18px}}

/* giriş */
.login{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr)}
.login-art{position:relative;background:var(--cini-d);color:#fff;padding:24px 20px 28px;overflow:hidden;display:flex;flex-direction:column;gap:14px}
.login-art svg.pat{position:absolute;inset:0;width:100%;height:100%}
.login-art>*:not(svg.pat){position:relative}
.login-art .brand{color:#fff}
.login-art .brand svg{color:#fff}
.login-art h2{font-size:26px;margin-top:22px;max-width:16ch}
.login-art .lead{margin-top:10px;color:#CFE0F4;max-width:38ch}
.login-art .roles{display:none}
.login-form{padding:24px 20px 40px;display:flex;align-items:center;justify-content:center}
.login-form .inner{width:100%;max-width:400px;display:flex;flex-direction:column;gap:18px}
.demo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.demo button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:56px}
.demo button:hover{border-color:var(--cini)}
.demo b{display:block;font-weight:600}
.demo span{font-size:13px;color:var(--muted)}
@media(min-width:900px){
  .login{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
  .login-art{padding:48px 56px;display:flex;flex-direction:column;justify-content:space-between;min-height:100vh}
  .login-art h2{font-size:40px;max-width:14ch}
  .login-art .roles{display:grid;gap:10px;margin-top:28px;color:#CFE0F4}
  .login-form{padding:48px}
}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}.sw::after{transition:none}}

/* yazışma, uyarı listesi, grafik */
input[type=checkbox]{width:20px;height:20px;accent-color:var(--cini);flex:none;margin-top:3px}
.thread{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.bub{padding:10px 12px;border-radius:12px;background:#fff;border:1px solid var(--line);max-width:94%}
.bub.me{background:var(--cini-wash);border-color:transparent;align-self:flex-end}
.bub .bh{font-size:13px;margin-bottom:2px}
.ins{border-top:1px solid var(--line)}
.ins summary{list-style:none;display:flex;gap:12px;align-items:center;padding:14px 16px;cursor:pointer;min-height:60px}
.ins summary::-webkit-details-marker{display:none}
.ins .ib{padding:0 16px 14px 62px;color:var(--ink-2);font-size:14px;display:flex;flex-direction:column;gap:6px}
.ch{width:100%;height:auto;display:block}
.ch text{fill:var(--muted);font-size:11px;font-family:var(--font-body)}
.ch .bi{fill:var(--cini)}
.ch .bo{fill:var(--turq)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}

/* v3 */
details.chk>summary{list-style:none;cursor:pointer}
details.chk>summary::-webkit-details-marker{display:none}
details.chk .chev{margin-left:auto;color:var(--muted);transition:transform .18s;flex:none}
details.chk[open] .chev{transform:rotate(90deg)}
details.chk .cbody{padding:2px 0 8px 38px}
.card.chk{padding:0}.card.chk>summary{padding:14px 16px;border-top:0}.card.chk>.cbody{padding:0 16px 16px}
.mini{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:10px 0;border-top:1px solid var(--line)}
.mini:first-child{border-top:0}
.mini .m2{grid-column:1 / 3;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flow{display:flex;gap:8px;flex-wrap:wrap}
.flow span{display:flex;align-items:center;gap:8px;background:var(--cini-wash);color:var(--cini);border-radius:999px;padding:5px 12px 5px 5px;font-size:13.5px;font-weight:500}
.flow i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--cini);color:#fff;display:grid;place-items:center;font-size:12px}
.ritem{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ritem .rtop{display:flex;justify-content:space-between;gap:12px}
.ritem .rctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ritem .qty{width:84px}
.ritem select{flex:1 1 160px;width:auto}
.inl{display:flex;gap:8px;align-items:center;font-size:14px}
.inl input{margin-top:0}
.xl{overflow-x:auto;position:relative;border:1px solid var(--line);border-radius:14px;background:#fff}
.xt{border-collapse:collapse;min-width:900px;width:100%;font-size:14px}
