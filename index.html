<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>KaisPilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>/* Yerleşim fikri: telefonda alt sekme çubuğu, geniş ekranda sol menü. Defter satırı gibi okunan listeler, İznik çinisinden gelen mavi ve geometrik desen. */
:root{
  --ink:#12213B;
  --ink-2:#3B4A63;
  --muted:#66738A;
  --canvas:#F2F5F9;
  --surface:#FFFFFF;
  --line:#DCE3EC;
  --cini:#0D56A6;
  --cini-d:#093F7A;
  --cini-wash:#E5EFFA;
  --turq:#17A2A0;
  --nar:#C23A4D;
  --nar-wash:#FBEAED;
  --safran:#8F5E0B;
  --safran-wash:#FBF1DC;
  --yesil:#1F7753;
  --yesil-wash:#E2F3EA;
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--canvas);color:var(--ink);font:400 15px/1.5 var(--font-body);color-scheme:light;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em;font-weight:650;line-height:1.2}
h2{font-size:22px}
h3{font-size:17px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--cini)}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--turq);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.ic{flex:none}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-lg{display:flex;flex-direction:column;gap:20px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.right{text-align:right}

/* kabuk */
.shell{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr)}
.side{display:none}
.col{min-width:0}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.top .mark{display:inline-flex;color:var(--cini)}
.ptitle{font-size:19px}
.biz{display:none;font-size:13px;color:var(--muted)}
.avatar{width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;font:600 13px var(--font-display);color:#fff;border:0;flex:none}
.main{padding:16px 16px 100px;max-width:1040px;width:100%;margin:0 auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;padding:6px 2px;font-size:11.5px;color:var(--muted);min-height:50px;border-radius:10px}
.tab[aria-current=page]{color:var(--cini);font-weight:600}
.brand{display:flex;align-items:center;gap:10px;font:700 21px var(--font-display);color:var(--ink)}
.brand svg{color:var(--cini)}
@media(min-width:900px){
  .shell{grid-template-columns:248px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;gap:20px;padding:20px 14px;background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh}
  .side nav{display:flex;flex-direction:column;gap:2px}
  .side .nav{display:flex;align-items:center;gap:12px;border:0;background:transparent;padding:10px 12px;border-radius:10px;color:var(--ink-2);font-weight:500;text-align:left;min-height:44px}
  .side .nav:hover{background:var(--canvas)}
  .side .nav[aria-current=page]{background:var(--cini-wash);color:var(--cini)}
  .side .me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid var(--line)}
  .tabbar{display:none}
  .top .mark,.top .avatar{display:none}
  .biz{display:block;margin-left:auto}
  .main{padding:24px 28px 40px}
}

/* bileşenler */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.card.flush{padding:0;overflow:hidden}
.card h3+.muted{margin-top:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid transparent;background:var(--cini);color:#fff;font-weight:500;text-decoration:none}
.btn:hover{background:var(--cini-d)}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.sec:hover{background:var(--canvas)}
.btn.ghost{background:transparent;color:var(--cini)}
.btn.ghost:hover{background:var(--cini-wash)}
.btn.bad{background:var(--nar)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:500;white-space:nowrap}
.p-ok{background:var(--yesil-wash);color:var(--yesil)}
.p-warn{background:var(--safran-wash);color:var(--safran)}
.p-bad{background:var(--nar-wash);color:var(--nar)}
.p-info{background:var(--cini-wash);color:var(--cini)}
.p-mute{background:#E9EDF3;color:var(--ink-2)}
.seg{display:inline-flex;background:#E6EBF2;border-radius:10px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:8px;min-height:38px;color:var(--ink-2);font-weight:500;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--cini);box-shadow:0 1px 2px rgba(18,33,59,.14)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;min-height:36px;font-size:14px;color:var(--ink-2)}
.chip[aria-pressed=true]{background:var(--cini);border-color:var(--cini);color:#fff}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:13.5px;font-weight:500;color:var(--ink-2)}
input[type=text],input[type=email],input[type=password],input[type=number],select,textarea{width:100%;min-height:44px;border:1px solid #C7D0DD;border-radius:10px;padding:10px 12px;font:inherit;background:#fff;color:var(--ink)}
textarea{min-height:88px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--cini)}
.err{color:var(--nar);font-size:13.5px;min-height:20px}
.callout{display:flex;gap:10px;padding:12px 14px;border-radius:12px;background:var(--cini-wash);color:var(--ink);font-size:14px}
.callout.warn{background:var(--safran-wash)}
.callout .ic{margin-top:2px;color:var(--cini)}
.callout.warn .ic{color:var(--safran)}
.section-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* yapılacaklar */
.todo{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-height:68px}
.todo:hover{border-color:#B9C6D8}
.todo .dot{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.todo b{display:block;font-weight:600}
.todo .sub{color:var(--muted);font-size:13.5px}
.tone-bad{background:var(--nar-wash);color:var(--nar)}
.tone-warn{background:var(--safran-wash);color:var(--safran)}
.tone-info{background:var(--cini-wash);color:var(--cini)}
.tone-ok{background:var(--yesil-wash);color:var(--yesil)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{padding:12px;border-radius:12px;background:var(--canvas)}
.kpi .v{font:650 17px var(--font-display);margin-top:2px}
.kpi .l{font-size:12.5px;color:var(--muted)}

/* defter satırı */
.ledger{padding:0 16px}
.lrow{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:6px 12px;padding:13px 0 13px 12px;border-top:1px solid var(--line);border-left:3px solid transparent;margin-left:-16px;padding-left:25px}
.lrow:first-child{border-top:0}
.lrow.s-eksik{border-left-color:var(--nar)}
.lrow.s-belgesiz{border-left-color:#D9A441}
.lrow.s-eslesti{border-left-color:var(--yesil)}
.lrow .ld{color:var(--muted);font-size:13px;padding-top:2px}
.lrow .lt{font-weight:500;overflow-wrap:anywhere}
.lrow .lamt{font-weight:600;text-align:right;white-space:nowrap}
.lrow .lamt.in{color:var(--yesil)}
.lrow .lfoot{grid-column:2 / 4;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;padding:14px 16px;border-top:1px solid var(--line)}
.rrow:first-child{border-top:0}
.rrow .rfoot{grid-column:1 / 3;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rrow select{min-height:36px;width:auto;padding:4px 10px;font-size:14px}

/* ekip */
.emp{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}
.emp:first-child{border-top:0}
.emp .meta{grid-column:2 / 4;color:var(--muted);font-size:13.5px}
.emp .act{grid-column:2 / 4;display:flex;gap:8px;flex-wrap:wrap}
.clock{text-align:center;padding:24px 16px}
.clock .state{font:650 28px var(--font-display);margin:6px 0 2px}
.timer{font:650 52px var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.timer.over{color:var(--nar)}
.logline{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.logline:first-child{border-top:0}

/* sıralama */
.rk{border-top:1px solid var(--line)}
.rk:first-child{border-top:0}
.rk summary{list-style:none;display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:14px 16px;cursor:pointer;min-height:64px}
.rk summary::-webkit-details-marker{display:none}
.rk .pos{font:650 20px var(--font-display);color:var(--cini)}
.rk .bar{grid-column:2 / 4;height:8px;border-radius:99px;background:#E6EBF2;overflow:hidden}
.rk .bar i{display:block;height:100%;background:var(--cini);border-radius:99px}
.rk .score{font:650 20px var(--font-display);text-align:right}
.rk .body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-weight:500;color:var(--muted);text-align:left;padding:6px 6px 6px 0;font-size:13px}
.tbl td{padding:8px 6px 8px 0;border-top:1px solid var(--line)}
.tbl td.r,.tbl th.r{text-align:right;padding-right:0;padding-left:14px;white-space:nowrap}
.tbl th,.tbl td{padding-right:10px}
.tbl th{white-space:nowrap}
.tblwrap{overflow-x:auto}
.weights{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.weights .wl{display:flex;justify-content:space-between;font-size:14px}
@media(min-width:700px){.weights{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* duyuru ve stok */
.msg{padding:16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.msg:first-child{border-top:0}
.msg .mh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.who{display:flex;gap:6px;flex-wrap:wrap}
.stk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}
.stk:first-child{border-top:0}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.stepper b{min-width:44px;text-align:center;font:650 17px var(--font-display);font-variant-numeric:tabular-nums}
.minibar{height:6px;border-radius:99px;background:#E6EBF2;overflow:hidden;margin-top:6px;max-width:220px}
.minibar i{display:block;height:100%;border-radius:99px}
.csv{font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;min-height:150px;white-space:pre;overflow:auto}
.check{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.check:first-child{border-top:0}
.check .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none}
.client{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-height:72px}
.client[aria-pressed=true]{border-color:var(--cini);box-shadow:0 0 0 1px var(--cini)}
.prog{height:8px;border-radius:99px;background:#E6EBF2;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--turq);border-radius:99px}
.toggle{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.toggle:first-child{border-top:0}
.sw{width:46px;height:28px;border-radius:99px;border:0;background:#C7D0DD;position:relative;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-checked=true]{background:var(--cini)}
.sw[aria-checked=true]::after{transform:translateX(18px)}

/* modal ve bildirim */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(18,33,59,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:520px;padding:20px 20px calc(20px + env(safe-area-inset-bottom));max-height:92%;overflow:auto;display:flex;flex-direction:column;gap:14px}
.sheet .sh{display:flex;justify-content:space-between;align-items:center;gap:12px}
.xbtn{width:40px;height:40px;border-radius:10px;border:0;background:var(--canvas);display:grid;place-items:center}
.drop{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:28px 16px;border:2px dashed #B9C6D8;border-radius:14px;color:var(--cini);cursor:pointer;background:var(--cini-wash)}
.drop b{color:var(--ink)}
.spin{width:34px;height:34px;border-radius:50%;border:4px solid var(--cini-wash);border-top-color:var(--cini);animation:spin .9s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.conf{height:8px;border-radius:99px;background:#E6EBF2;overflow:hidden}
.conf i{display:block;height:100%;background:var(--yesil);border-radius:99px}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 12px;font-size:14.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500}
#toasts{position:fixed;left:0;right:0;bottom:84px;z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-size:14.5px;max-width:420px;box-shadow:0 6px 20px rgba(18,33,59,.25)}
.toast.bad{background:var(--nar)}
.toast.warn{background:var(--safran)}
@media(min-width:900px){#toasts{bottom:24px}.overlay{align-items:center}.sheet{border-radius:18px}}

/* giriş */
.login{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr)}
.login-art{position:relative;background:var(--cini-d);color:#fff;padding:24px 20px 28px;overflow:hidden;display:flex;flex-direction:column;gap:14px}
.login-art svg.pat{position:absolute;inset:0;width:100%;height:100%}
.login-art>*:not(svg.pat){position:relative}
.login-art .brand{color:#fff}
.login-art .brand svg{color:#fff}
.login-art h2{font-size:26px;margin-top:22px;max-width:16ch}
.login-art .lead{margin-top:10px;color:#CFE0F4;max-width:38ch}
.login-art .roles{display:none}
.login-form{padding:24px 20px 40px;display:flex;align-items:center;justify-content:center}
.login-form .inner{width:100%;max-width:400px;display:flex;flex-direction:column;gap:18px}
.demo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.demo button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:56px}
.demo button:hover{border-color:var(--cini)}
.demo b{display:block;font-weight:600}
.demo span{font-size:13px;color:var(--muted)}
@media(min-width:900px){
  .login{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
  .login-art{padding:48px 56px;display:flex;flex-direction:column;justify-content:space-between;min-height:100vh}
  .login-art h2{font-size:40px;max-width:14ch}
  .login-art .roles{display:grid;gap:10px;margin-top:28px;color:#CFE0F4}
  .login-form{padding:48px}
}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}.sw::after{transition:none}}

/* yazışma, uyarı listesi, grafik */
input[type=checkbox]{width:20px;height:20px;accent-color:var(--cini);flex:none;margin-top:3px}
.thread{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.bub{padding:10px 12px;border-radius:12px;background:#fff;border:1px solid var(--line);max-width:94%}
.bub.me{background:var(--cini-wash);border-color:transparent;align-self:flex-end}
.bub .bh{font-size:13px;margin-bottom:2px}
.ins{border-top:1px solid var(--line)}
.ins summary{list-style:none;display:flex;gap:12px;align-items:center;padding:14px 16px;cursor:pointer;min-height:60px}
.ins summary::-webkit-details-marker{display:none}
.ins .ib{padding:0 16px 14px 62px;color:var(--ink-2);font-size:14px;display:flex;flex-direction:column;gap:6px}
.ch{width:100%;height:auto;display:block}
.ch text{fill:var(--muted);font-size:11px;font-family:var(--font-body)}
.ch .bi{fill:var(--cini)}
.ch .bo{fill:var(--turq)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}

/* v3 */
details.chk>summary{list-style:none;cursor:pointer}
details.chk>summary::-webkit-details-marker{display:none}
details.chk .chev{margin-left:auto;color:var(--muted);transition:transform .18s;flex:none}
details.chk[open] .chev{transform:rotate(90deg)}
details.chk .cbody{padding:2px 0 8px 38px}
.card.chk{padding:0}.card.chk>summary{padding:14px 16px;border-top:0}.card.chk>.cbody{padding:0 16px 16px}
.mini{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:10px 0;border-top:1px solid var(--line)}
.mini:first-child{border-top:0}
.mini .m2{grid-column:1 / 3;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flow{display:flex;gap:8px;flex-wrap:wrap}
.flow span{display:flex;align-items:center;gap:8px;background:var(--cini-wash);color:var(--cini);border-radius:999px;padding:5px 12px 5px 5px;font-size:13.5px;font-weight:500}
.flow i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--cini);color:#fff;display:grid;place-items:center;font-size:12px}
.ritem{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ritem .rtop{display:flex;justify-content:space-between;gap:12px}
.ritem .rctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ritem .qty{width:84px}
.ritem select{flex:1 1 160px;width:auto}
.inl{display:flex;gap:8px;align-items:center;font-size:14px}
.inl input{margin-top:0}
.xl{overflow-x:auto;position:relative;border:1px solid var(--line);border-radius:14px;background:#fff}
.xt{border-collapse:collapse;min-width:900px;width:100%;font-size:14px}
.xt th{font-weight:500;color:var(--muted);text-align:left;padding:10px 8px;font-size:13px;background:#F6F8FB;white-space:nowrap}
.xt th.r{text-align:right}
.xt td{border-top:1px solid var(--line);padding:2px 4px;white-space:nowrap}
.xt td.rt{text-align:right;padding:0 10px}
.xt input.cell,.xt select.cell{border:1px solid transparent;background:transparent;min-height:40px;padding:6px 8px;border-radius:6px;font:inherit;width:auto}
.xt input.cell.r{text-align:right}

function rowStatus(r) {
  if (r.kind === 'gelir') return 'gelir';
  if (r.kind === 'maas') return 'maas';
  if (r.kind === 'tekrar') return 'tekrar';
  if (RECEIPTS.some((f) => f.bank === r.id)) return 'eslesti';
  if (r.belgesiz) return 'belgesiz';
  return 'eksik';
}
const countStatus = (s) => ROWS.filter((r) => rowStatus(r) === s).length;
const totals = () => ({
  in: ROWS.filter((r) => r.amt > 0).reduce((a, r) => a + r.amt, 0),
  out: ROWS.filter((r) => r.amt < 0).reduce((a, r) => a + -r.amt, 0),
});
const kdv = (f) => f.total - f.total / (1 + f.rate / 100);
function scores() {
  const W = S.weights;
  const sum = W.late + W.over + W.miss + W.task;
  return EMP_IDS.map((id) => {
    const d = EMPDATA[id];
    const parts = CRIT.map((c) => {
      const comp = c.comp(d[c.k]);
      const w = W[c.k];
      return { c, comp, w, share: sum ? (w / sum) * 100 : 0, contrib: sum ? (w * comp) / sum : 0 };
    });
    const score = parts.reduce((a, p) => a + p.contrib, 0);
    return { id, d, parts, score };
  }).sort((a, b) => b.score - a.score);
}

  </div>

function msgCard(m, fresh, asEmp) {
  const names = (ids) => ids.map((id) => esc(byId(id).name.split(' ')[0])).join(', ');
  const kabul = m.to.filter((id) => m.res[id] === 'kabul');
  const red = m.to.filter((id) => m.res[id] === 'red');
  const bek = m.to.filter((id) => !m.res[id]);
  const uid = S.user.id;
  let foot = '';
  if (asEmp && m.type === 'mesai') {
    const r = m.res[uid];
    foot = r ? `<span class="pill ${r === 'kabul' ? 'p-ok' : 'p-mute'}">${r === 'kabul' ? 'Kabul ettin' : 'Reddettin'}</span>${r === 'red' && m.why && m.why[uid] ? `<p class="small muted">Mazeretin: ${esc(m.why[uid].text)}</p>` : ''}` : `<div class="row wrap"><button class="btn" data-a="respond" data-id="${m.id}" data-v="kabul">Kabul ediyorum</button><button class="btn sec" data-a="respond" data-id="${m.id}" data-v="red">Reddet</button></div><p class="small muted">Cevabın işverenle paylaşılır ve kayda geçer.</p>`;
  } else if (!asEmp) {
    foot = `<div class="small muted">Okundu ${m.reads.filter((id) => m.to.includes(id)).length}/${m.to.length}${m.reads.length < m.to.length ? ' · okumayanlar: ' + names(m.to.filter((id) => !m.reads.includes(id))) : ''}</div>` +
      (m.type === 'mesai' ? `<div class="who"><span class="pill p-ok">Kabul ${kabul.length}</span><span class="pill p-warn">Bekliyor ${bek.length}</span><span class="pill p-mute">Red ${red.length}</span></div>${red.map((id) => (m.why && m.why[id] ? `<div class="callout warn" style="margin-top:8px">${ic('chat')}<div><b>${esc(byId(id).name.split(' ')[0])} reddetti, mazereti:</b><p style="margin-top:2px">${esc(m.why[id].text)}</p></div></div>` : '')).join('')}` : '');
  }
  return `<div class="msg"><div class="mh">${m.type === 'mesai' ? '<span class="pill p-warn">Mesai teklifi</span>' : '<span class="pill p-info">Duyuru</span>'}${fresh ? '<span class="pill p-bad">Yeni</span>' : ''}<span class="small muted">${esc(m.time)}</span></div>

  let foot = `<span class="pill ${pill[0]}">${pill[1]}</span>`;
  if (rc) foot += `<span class="small muted">${esc(rc.seller)} · ${esc(rc.cat)}</span>`;
  if (rc && ledgerMis(rc.id)) foot += '<span class="pill p-bad">Tabloyla uyuşmuyor</span>';
  else if (r.cat) foot += `<span class="small muted">${esc(r.cat)}</span>`;

    if (mode === 'muh') foot += r.requested ? '<span class="pill p-warn">Belge istendi</span>' : `<button class="btn sm sec" data-a="request" data-id="${r.id}">Eksik belge iste</button>`;

      foot += `<button class="btn sm" data-a="upload">${ic('camera', 16)} Fiş ekle</button><button class="btn sm sec" data-a="nodoc" data-id="${r.id}">Fişim yok</button>`;

  return `<div class="lrow s-${st}"><div class="ld">${esc(r.date)}</div><div class="lt">${esc(r.desc)}</div><div class="lamt num ${r.amt > 0 ? 'in' : ''}">${r.amt > 0 ? '+' : ''}${fmt(r.amt)}</div><div class="lfoot">${foot}</div></div>`;

function chartHTML() {
  const t = totals();
  const data = MONTHS.concat([{ m: 'Eki', in: t.in, out: t.out }]);
  const max = Math.max(...data.flatMap((d) => [d.in, d.out]));
  const base = 130; const top = 24;
  const bars = data.map((d, i) => {
    const x = 20 + i * 100; const hi = (d.in / max) * (base - top); const ho = (d.out / max) * (base - top);
    return `<rect class="bi" x="${x}" y="${base - hi}" width="38" height="${hi}" rx="3"/><rect class="bo" x="${x + 42}" y="${base - ho}" width="38" height="${ho}" rx="3"/><text x="${x + 19}" y="${base - hi - 5}" text-anchor="middle">${Math.round(d.in / 1000)}K</text><text x="${x + 61}" y="${base - ho - 5}" text-anchor="middle">${Math.round(d.out / 1000)}K</text><text x="${x + 40}" y="${base + 17}" text-anchor="middle">${d.m}</text>`;
  }).join('');
  return `<svg class="ch" viewBox="0 0 320 150" role="img" aria-label="Son üç ayın gelen ve giden toplamları, bin lira"><line x1="8" x2="312" y1="${base}" y2="${base}" stroke="#DCE3EC"/>${bars}</svg><div class="legend"><span><i style="background:var(--cini)"></i>Gelen</span><span><i style="background:var(--turq)"></i>Giden</span><span>Bin ₺, ağustos ve eylül örnek veridir</span></div>`;
}

  <p class="small muted">Satışların %10 KDV ile yapıldığı varsayıldı. İndirilecek tutar yalnızca onaylı belgelerden hesaplandı. ${countStatus('eksik')} belgesiz işlem hesaba girmedi.</p></div>`;
}

  if (miss.length) ins.push(['bad', 'alert', `${miss.length} işlemin belgesi eksik`, `Belgesiz görünen toplam ${fmt(missSum)}. Belge eklenmezse bu tutarlar gider olarak işlenemeyebilir, muhasebeciyle teyit et.`, miss.map((r) => `${r.date} ${r.desc}: ${fmt(r.amt)}`).join(' · ')]);

    root.innerHTML = sheet('Menü', `<div class="row">${avatar(u, 44)}<div><b>${esc(u.name)}</b><div class="small muted">${esc(ROLE_LABEL[u.role])} · ${esc(BIZ)}</div></div></div>

      <dt><label for="mcat">Kategori</label></dt><dd><select id="mcat" data-ch="mcat">${CATS.map((c) => `<option ${c === m.cat ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></dd></dl>

      <p class="small muted">${S.user.role === 'calisan' ? 'Fiş işverene onay için gider.' : 'Kaydedince fiş muhasebeciye anında bildirim olarak gider. Gider, muhasebeci onaylayınca tabloya yazılır.'}</p>

/* ---------- eylemler ---------- */
H.backdrop = (el, e) => { if (e.target === el) H.closemodal(); };
H.closemodal = () => { S.modal = null; renderModal(); };
H.demo = (el) => loginAs(byId(el.dataset.id));
H.logout = () => { S.user = null; S.modal = null; S.loginErr = ''; render(); };
H.menu = () => { S.modal = { type: 'menu' }; renderModal(); };
H.nav = (el) => {
  S.modal = null;
  const v = el.dataset.v;
  if (el.dataset.s) {
    if (v === 'muhasebe') S.sub.muhasebe = el.dataset.s;
    if (v === 'ekip') S.sub.ekip = el.dataset.s;
    if (el.dataset.s === 'ekstre') S.filter = 'eksik';
    if (v === 'ekip' && el.dataset.s === 'siralama') S.openRank = EMP_IDS.filter((id) => EMPDATA[id].itiraz && EMPDATA[id].itiraz.unreadBoss);
  }
  go(v);
};
H.sub = (el) => {
  if (el.dataset.g === 'msgtype') { snap(); S.draft.type = el.dataset.v; render(); return; }
  S.sub[el.dataset.g] = el.dataset.v;
  if (el.dataset.g === 'muhasebe' || el.dataset.g === 'belgeler') S.filter = 'hepsi';
  render();
};
H.filter = (el) => { S.filter = el.dataset.v; render(); };
H.insight = () => { S.insightOpen = !S.insightOpen; render(); };
H.client = (el) => { S.client = el.dataset.id; render(); };

function loginAs(u) {
  S.user = u;
  S.view = u.role === 'muhasebeci' ? 'donem' : 'bugun';
  S.modal = null;
  render();
  if (typeof window !== 'undefined' && window.scrollTo) window.scrollTo(0, 0);
}

/* fiş yükleme */
function nextSample() {
  if (S.user.role === 'calisan') { const s = EMP_SAMPLES[S.empIdx % EMP_SAMPLES.length]; S.empIdx++; return s; }
  const taken = RECEIPTS.map((f) => f.bank);
  return SAMPLES.find((x) => !taken.includes(x.bank)) || GENERIC[0];
}
H.upload = () => { if (locked()) return; S.modal = { type: 'upload', step: 'pick' }; renderModal(); };
function startRead() {
  const s = nextSample();
  S.modal = { type: 'upload', step: 'reading', sample: s, cat: s.cat };
  renderModal();
  setTimeout(() => {
    if (!S.modal || S.modal.step !== 'reading') return;
    S.modal.step = s.ask ? 'ask' : 'result';
    renderModal();
  }, 1300);
}
H.sample = startRead;
H.answer = (el) => {
  const m = S.modal;
  m.cat = el.dataset.v;
  if (!RULES.some((r) => r.k === m.sample.seller)) RULES.unshift({ k: m.sample.seller, v: m.cat });
  m.step = 'result';
  renderModal();
};
H.savereceipt = () => {
  const m = S.modal;
  const s = m.sample;
  const isEmp = S.user.role === 'calisan';
  RECEIPTS.push({ id: 'f' + ++seq, seller: s.seller, date: s.date, total: s.total, rate: s.rate, cat: m.cat || 'Diğer', status: isEmp ? 'bekliyor' : 'onayli', by: S.user.id, bank: isEmp ? null : s.bank || null });
  const bank = !isEmp && s.bank ? ROWS.find((r) => r.id === s.bank) : null;
  S.modal = null;
  render();
  toast(bank ? `Fiş kaydedildi. Ekstredeki ${bank.date} işlemiyle eşleşti.` : isEmp ? 'Fiş işverene onay için gitti.' : 'Fiş kaydedildi.', 'ok');
};
H.approve = (el) => { if (locked()) return; const f = RECEIPTS.find((x) => x.id === el.dataset.id); f.status = 'onayli'; render(); toast('Fiş onaylandı.'); };
H.reject = (el) => { if (locked()) return; const f = RECEIPTS.find((x) => x.id === el.dataset.id); f.status = 'reddedildi'; render(); toast('Fiş reddedildi.'); };
H.nodoc = (el) => { if (locked()) return; S.modal = { type: 'nodoc', id: el.dataset.id }; renderModal(); };
H.nodocok = (el) => { ROWS.find((r) => r.id === el.dataset.id).belgesiz = true; S.modal = null; render(); toast('İşlem "belgesiz" olarak işaretlendi. Gider yazılmadı.', 'warn'); };
H.request = (el) => { if (locked()) return; ROWS.find((r) => r.id === el.dataset.id).requested = true; render(); toast('Patrona belge isteği gitti.'); };

/* ekip */
H.clockin = () => { const a = ATT[S.user.id]; a.state = 'working'; a.inAt = hhmm(new Date()); a.log.push(['Giriş', a.inAt]); render(); toast('Giriş kaydedildi: ' + a.inAt, 'ok'); };
H.breakstart = () => { const a = ATT[S.user.id]; a.state = 'break'; a.bstart = Date.now(); a.n1 = a.n2 = false; a.log.push(['Mola başladı', hhmm(new Date())]); render(); };
H.breakend = () => {
  const a = ATT[S.user.id];
  const min = Math.max(1, Math.round((Date.now() - a.bstart) / 60000));
  a.breakMin += min; a.state = 'working';
  a.log.push(['Döndüm', hhmm(new Date()) + ' · ' + min + ' dk mola']);
  render();

function tick() {
  if (!S.user || !ATT[S.user.id]) return;

  }
}

function dueOf(uid) {
  const p = PROFILES[uid];
  const hourly = p.salary / 225;
  const ot = Math.round(p.otMonth * hourly * 1.5);
  const offers = MSGS.filter((m) => m.type === 'mesai' && m.res[uid] === 'kabul');

  const paid = PAYS.filter((x) => x.uid === uid && x.per === NEXTP).reduce((a, x) => a + x.amt, 0);

  const total = p.salary + ot + offPay - ded;
  return { hourly, ot, offers, offPay, ded, paid, total, left: total - paid };
}

  return `<div class="rrow"><div><b style="font-weight:600">${esc(f.seller)}</b><div class="small muted">${esc(f.date)} · yükleyen ${esc(u.name.split(' ')[0])} · ${esc(f.cat)}${f.rate ? ' · KDV %' + f.rate + ': ' + fmt(kdv(f)) : ''}</div></div><div class="num" style="font-weight:600">${fmt(f.total)}</div>

}

  <details class="chk card" id="ck-mail" ${S.openChk.includes('mail') ? 'open' : ''}><summary class="check"><span class="dot tone-info">${ic('mail', 16)}</span><div class="grow"><b style="font-weight:600">E-posta ile gelen faturalar</b><div class="small muted">${esc(mailSub)}</div></div><span class="chev">${ic('chevron', 18)}</span></summary><div class="cbody">${epostaHTML()}</div></details>

/* ---------- muhasebeci: gelen kutusu ---------- */

}

/* ---------- gider tablosu ---------- */
const srcPill = (r) => (r.edited ? '<span class="pill p-warn">Düzenlendi</span>' : r.src === 'Kais' ? '<span class="pill p-info">Kais yazdı</span>' : r.src === 'Ekstre' ? '<span class="pill p-mute">Ekstreden</span>' : '<span class="pill p-mute">Elle</span>');
const CELL_LAB = { date: 'tarih', desc: 'açıklama', doc: 'belge', total: 'toplam' };
function ledgerTr(r, dis) {
  const inp = (k, v, w, num) => `<input class="cell ${num ? 'r' : ''}" ${num ? 'type="number" step="0.01" inputmode="decimal"' : 'type="text"'} value="${esc(v)}" style="width:${w}px" data-ch="cell" data-id="${r.id}" data-k="${k}" aria-label="${esc(r.desc)} ${CELL_LAB[k]}" ${dis}>`;
  return `<tr class="${r.fresh ? 'fresh' : ''} ${mismatch(r) ? 'mis' : ''}" id="lr-${r.id}"><td>${inp('date', r.date, 70)}</td><td>${inp('desc', r.desc, 190)}</td>
  <td><select class="cell" data-ch="cell" data-id="${r.id}" data-k="acc" aria-label="${esc(r.desc)} hesap" ${dis}>${CATS.map((c) => `<option ${c === r.acc ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></td>
  <td>${inp('doc', r.doc, 74)}</td>
  <td><select class="cell" data-ch="cell" data-id="${r.id}" data-k="rate" aria-label="${esc(r.desc)} KDV oranı" ${dis}>${[0, 1, 10, 20].map((x) => `<option value="${x}" ${x === Number(r.rate) ? 'selected' : ''}>%${x}</option>`).join('')}</select></td>
  <td class="num rt" id="lk-${r.id}">${fmt(kdv(r))}</td><td>${inp('total', r.total, 104, true)}</td><td id="ls-${r.id}">${srcCell(r)}</td>
  <td><button class="xbtn sm" data-a="ldel" data-id="${r.id}" aria-label="${esc(r.desc)} satırını sil" ${dis}>${ic('trash', 16)}</button></td></tr>`;
}
function tabloHTML(role) {
  const dis = S.closed ? 'disabled' : '';
  const sumT = LEDGER.reduce((a, r) => a + (Number(r.total) || 0), 0);
  const sumK = LEDGER.reduce((a, r) => a + kdv(r), 0);
  const nf = LEDGER.filter((r) => r.fresh).length;
  const html = `<div class="stack-lg">
  <div class="row between wrap"><div><h2>Gider tablosu</h2><p class="muted small" style="margin-top:4px">Muhasebeci bir fişi onaylayınca satır buraya kendiliğinden yazılır. Hücreye dokunup elle düzeltebilirsin.</p></div><div class="row wrap"><button class="btn sec sm" data-a="copycsv">CSV kopyala</button>${xlsxBtn()}<button class="btn sm" data-a="ladd" ${dis}>${ic('plus', 16)} Satır ekle</button></div></div>
  ${nf ? `<div class="callout">${ic('sparkle')}<div><b>${nf} yeni gider yazıldı</b><p style="margin-top:2px">Yeşil satırları Kais onaylanan fişlerden yazdı.</p></div></div>` : ''}
  ${S.closed ? `<div class="callout warn">${ic('lock')}<div>${PERIOD} dönemi kapalı, tablo düzenlenemez.</div></div>` : ''}
  <div class="xl"><table class="xt"><thead><tr><th>Tarih</th><th>Açıklama</th><th>Hesap</th><th>Belge</th><th>KDV %</th><th class="r">KDV</th><th class="r">Toplam</th><th>Kaynak</th><th><span class="sr">Sil</span></th></tr></thead>
  <tbody id="xt-body">${LEDGER.map((r) => ledgerTr(r, dis)).join('')}</tbody>
  <tfoot><tr><td colspan="5">${LEDGER.length} satır</td><td class="num rt" id="lf-kdv">${fmt(sumK)}</td><td class="num rt" id="lf-tot">${fmt(sumT)}</td><td colspan="2"></td></tr></tfoot></table></div>
  <p class="small muted">Yana kaydırarak tüm sütunları görürsün. Oran ya da toplam değişince KDV kendiliğinden hesaplanır. Elle değiştirilen satır "Düzenlendi" olarak işaretlenir.</p></div>`;
  if (role === 'patron') { LEDGER.forEach((r) => { r.fresh = false; }); RECEIPTS.forEach((f) => { f.fresh = false; }); }

}
function ledgerRefresh(r) {
  const set = (id, v, html) => { const el = document.getElementById(id); if (!el) return; if (html) el.innerHTML = v; else el.textContent = v; };
  set('lk-' + r.id, fmt(kdv(r)));
  set('ls-' + r.id, srcCell(r), true);
  set('lf-kdv', fmt(LEDGER.reduce((a, x) => a + kdv(x), 0)));
  set('lf-tot', fmt(LEDGER.reduce((a, x) => a + (Number(x.total) || 0), 0)));
}
function csvText() {
  const n = (x) => Number(x).toFixed(2).replace('.', ',');
  const head = 'Tarih;Açıklama;Hesap;Belge;KDV %;KDV;Toplam;Kaynak';
  return [head].concat(LEDGER.map((r) => [r.date + ' 2026', String(r.desc).replace(/;/g, ','), r.acc, r.doc, r.rate, n(kdv(r)), n(r.total), r.edited ? 'Düzenlendi' : r.src].join(';'))).join('\n');
}
function kdvCard() {
  const t = totals();
  const hes = t.in - t.in / 1.1;
  const ind = LEDGER.reduce((a, r) => a + kdv(r), 0);
  return `<div class="card stack"><div><h3>KDV hazırlık özeti</h3><p class="muted small">Tahmini veri özeti, vergi tavsiyesi değildir. Beyanı muhasebeci hazırlar ve teyit eder.</p></div>
  <div class="kpis"><div class="kpi"><div class="l">Hesaplanan</div><div class="v num">${fmt0(hes)}</div></div><div class="kpi"><div class="l">İndirilecek</div><div class="v num">${fmt0(ind)}</div></div><div class="kpi"><div class="l">Fark</div><div class="v num">${fmt0(hes - ind)}</div></div></div>
  <p class="small muted">Satışların %10 KDV ile yapıldığı varsayıldı. İndirilecek tutar gider tablosundaki ${LEDGER.length} satırdan hesaplandı. ${countStatus('eksik')} belgesiz işlem hesaba girmedi.</p></div>`;

  return `<div class="stack-lg">
  <div class="card"><h3>${PERIOD} paketi</h3><p class="muted small">Muhasebeci için hazırlanan aylık çıktı. Eksik olanlara dokununca hangileri olduğunu görürsün.</p>
  ${plain(true, 'Tüm fişler okundu', `${RECEIPTS.length} fiş ve fatura kayıtlı`)}
  ${missRows.length ? exp('miss', `${missRows.length} işlemin belgesi eksik`, 'Hangileri olduğunu görmek için dokun', missBody) : plain(true, 'Eksik belge yok', 'Tüm harcamalar belgeyle eşleşti')}
  ${open.length ? exp('open', `${open.length} belge onay bekliyor`, 'Patron ya da muhasebeci onayında olanlar', openBody) : plain(true, 'Bekleyen onay yok', 'Tüm belgeler onaylandı')}

/* ---------- açılır liste ve geri bildirim ---------- */
function onToggle(e) {
  const d = e.target;
  if (!d.id) return;
  const key = d.id.slice(3);
  if (d.id.indexOf('rk-') === 0) { S.openRank = S.openRank.filter((x) => x !== key); if (d.open) S.openRank.push(key); }

}

function viewEkip() {
  const cur = S.sub.ekip;

  const canRank = isP || S.settings.mudurRanking;
  const nReq = LVREQ.filter((r) => ['bekliyor', 'yanit'].includes(r.status)).length;
  const tabs = [['bugun', 'Bugün'], ['talep', 'İzin talepleri' + (nReq ? ' (' + nReq + ')' : '')]].concat(isP ? [['maas', 'Maaş ve haklar']] : []).concat([['siralama', 'Aylık sıralama']]);

function onChange(e) {
  const el = e.target;
  const ch = el.dataset && el.dataset.ch;
  if (!ch) return;
  const m = S.modal;
  if (ch === 'file') { if (el.files && el.files.length) startRead(); }
  if (ch === 'aifile') { if (m && m.type === 'ai') { aiSnap(); m.file = true; m.fname = (el.files && el.files[0] && el.files[0].name) || 'is-sozlesmesi.jpg'; renderModal(); } }
  if (ch === 'mcat') S.modal.cat = el.value;
  if (ch === 'cat') { RECEIPTS.find((f) => f.id === el.dataset.id).cat = el.value; toast('Kategori güncellendi.'); }
  if (ch === 'role') { byId(el.dataset.id).role = el.value; toast(`${byId(el.dataset.id).name.split(' ')[0]} artık ${ROLE_LABEL[el.value]}.`); }
  if (m && m.type === 'rev') {
    const upd = () => { const k = document.getElementById('rv-kdv'); if (k) k.textContent = 'KDV tutarı: ' + fmt(kdv({ total: Number(m.total), rate: Number(m.rate) })); };
    if (ch === 'rcat') m.cat = el.value;
    if (ch === 'rrate') { m.rate = Number(el.value); upd(); }
    if (ch === 'rtotal') { m.total = Number(el.value) || 0; upd(); }
    if (ch === 'ritem') {
      const it = m.items[Number(el.dataset.i)]; const f = el.dataset.f;
      if (it) { if (f === 'on') it.on = el.checked; else if (f === 'qty') it.qty = Number(el.value) || 0; else if (f === 'stk') it.stk = el.value; }
    }
  }
  if (m && m.type === 'lvapp' && ch === 'lapp') {
    const f = el.dataset.f;
    if (f === 'type') { m.kind = el.value; m.ded = el.value === 'ucretsiz'; renderModal(); }
    else if (f === 'ded') { m.ded = el.value === '1'; renderModal(); }
    else if (f === 'perDay') { m.perDay = Number(el.value) || 0; const t = document.getElementById('la-sumt'); if (t) t.textContent = lappSum(m); }
  }
  if (ch === 'drem') { const d = DEBTS.find((x) => x.id === el.dataset.id); if (d) { d.rem = Number(el.value); toast('Hatırlatma günü güncellendi.'); } }
  if (ch === 'cell') {
    const r = LEDGER.find((x) => x.id === el.dataset.id);
    if (!r) return;
    if (S.closed) { toast(`${PERIOD} dönemi kapalı. Değişiklik için muhasebeciyle konuş.`, 'warn'); return; }
    const k = el.dataset.k; const old = r[k];
    r[k] = k === 'total' ? Number(el.value) || 0 : k === 'rate' ? Number(el.value) : el.value;
    r.edited = true; r.fresh = false;
    if (old !== r[k]) auditCell(r, k, old);
    ledgerRefresh(r);
  }
}

const TRM = { ocak: 1, şubat: 2, mart: 3, nisan: 4, mayıs: 5, haziran: 6, temmuz: 7, ağustos: 8, eylül: 9, ekim: 10, kasım: 11, aralık: 12 };
function dfParse(text) {
  const t = String(text || ''); const low = t.toLocaleLowerCase('tr-TR'); const warn = [];
  let name = (t.split(/,| diye | adlı | isimli | için /i)[0] || '').trim().replace(/^(yeni çalışan|bu)\s+/i, '');
  name = name.split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w.charAt(0).toLocaleUpperCase('tr-TR') + w.slice(1)).join(' ');
  const pm = low.match(/kasiyer|barista|servis|mutfak|aşçı|garson|şef|temizlik|kurye|bulaşıkçı/); const pos = pm ? pm[0].charAt(0).toLocaleUpperCase('tr-TR') + pm[0].slice(1) : '';
  const dm = low.match(/(\d{1,2})\s*(ocak|şubat|mart|nisan|mayıs|haziran|temmuz|ağustos|eylül|ekim|kasım|aralık)/);
  let hire = '';
  if (dm) { const mo = TRM[dm[2]]; hire = `${mo < REF.m ? REF.y + 1 : REF.y}-${String(mo).padStart(2, '0')}-${String(dm[1]).padStart(2, '0')}`; }
  const sm = t.match(/(\d{1,3}(?:[.\s]\d{3})+|\d{4,6})(?!\s*saat)/); const salary = sm ? Number(sm[1].replace(/[.\s]/g, '')) : 0;
  const stype = /brüt|brut/.test(low) ? 'brut' : 'net';
  const hm = low.match(/(\d{2})\s*saat/); const hours = hm ? Number(hm[1]) : 45;
  const tm = low.match(/deneme\s*(\d)\s*ay|(\d)\s*ay\s*deneme/); const trial = tm ? Number(tm[1] || tm[2]) : 2;
  if (!name) warn.push('Çalışanın adını anlayamadım.');
  if (!pos) warn.push('Görev yazılmamış, boş bıraktım.');
  if (!hire) warn.push('Başlangıç tarihi yazılmamış, boş bıraktım.');
  if (!salary) warn.push('Maaş yazılmamış, boş bıraktım.');
  else if (!/net|brüt|brut/.test(low)) warn.push('Maaşın net mi brüt mü olduğu yazılmamış, net varsaydım. Kontrol et.');
  if (!hm) warn.push('Haftalık saat yazılmamış, 45 saat yazdım.');
  if (!tm) warn.push('Deneme süresi yazılmamış, 2 ay yazdım.');
  return { name, pos, hire, salary, stype, hours, trial, payday: 30, warn };

const T26 = { asgBrut: 33030, asgNet: 28075.5, sgk: 0.14, isz: 0.01, damga: 0.00759, damgaEx: 250.7, kidemTavan: 73729.87,
  brk: [[190000, 0.15], [400000, 0.2], [1500000, 0.27], [5300000, 0.35], [Infinity, 0.4]] };
function gvTax(cum) { let t = 0; let lo = 0; for (const [hi, r] of T26.brk) { if (cum > lo) t += (Math.min(cum, hi) - lo) * r; lo = hi; } return t; }
function payroll(brut, m) {
  const sgk = brut * T26.sgk; const isz = brut * T26.isz; const mat = brut - sgk - isz;
  const gvRaw = gvTax(mat * m) - gvTax(mat * (m - 1));
  const mA = T26.asgBrut * (1 - T26.sgk - T26.isz);
  const gvEx = gvTax(mA * m) - gvTax(mA * (m - 1));
  const gv = Math.max(0, gvRaw - gvEx); const damga = Math.max(0, brut * T26.damga - T26.damgaEx);
  return { brut, sgk, isz, gv, damga, net: brut - sgk - isz - gv - damga };
}
function netToBrut(net, m) { let lo = net; let hi = net * 3; for (let i = 0; i < 60; i++) { const mid = (lo + hi) / 2; if (payroll(mid, m).net < net) lo = mid; else hi = mid; } return payroll((lo + hi) / 2, m); }
function empPayroll(uid) { const p = PROFILES[uid]; return p.stype === 'brut' ? payroll(p.salary, REF.m) : netToBrut(p.salary, REF.m); }
function exitInfo(uid) {
  const p = PROFILES[uid]; const mm = monthsBetween(p.hire); const wk = noticeWeeks(mm); const pr = empPayroll(uid);
  const yrs = mm / 12; const ihbar = (pr.brut / 30) * 7 * wk; const base = Math.min(pr.brut, T26.kidemTavan);
  const kidem = mm >= 12 ? base * yrs : 0;
  return { wk, ihbar, kidem, kidemNet: kidem * (1 - T26.damga), cap: pr.brut > T26.kidemTavan };
}

function pInit() {

function addDays(iso, n) { const a = iso.split('-').map(Number); const d = new Date(Date.UTC(a[0], a[1] - 1, a[2] + n)); return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0'); }
const supById = (id) => SUPPLIERS.find((t) => t.id === id);
const offersOf = (sid) => SUPPLIERS.filter((t) => t.items[sid] > 0);
function useOf(st) {
  if (st.use > 0) return { v: st.use, src: 'elle', days: 0 };
  const days = new Set(SALES.map((s) => s.date)).size;
  if (!days) return { v: 0, src: 'yok', days: 0 };
  let tot = 0; SALES.forEach((s) => { const rc = RECIPES[prodKey(s.prod)]; if (rc && rc.items[st.id]) tot += rc.items[st.id] * s.qty; });
  return { v: tot / days, src: tot > 0 ? 'satış' : 'yok', days };
}
function stockPlan() {
  const cover = Number(S.settings.cover) || 7;
  return STOCK.map((st) => {
    const u = useOf(st); const daily = u.v; const left = daily > 0 ? st.qty / daily : Infinity;
    const offs = offersOf(st.id); const leadMin = offs.length ? Math.min(...offs.map((t) => t.lead)) : 2;
    let status = 'ok'; if (left <= leadMin + 1) status = 'now'; else if (left <= leadMin + 4) status = 'soon';
    if (daily <= 0 && st.qty <= st.min) status = 'soon';
    let pick = null; let qty = 0; let late = false;
    if (status !== 'ok' && offs.length) {
      const fast = offs.filter((t) => t.lead <= Math.max(1, Math.floor(left)));
      const pool = fast.length ? fast : offs.slice().sort((a, b) => a.lead - b.lead).slice(0, 1); late = !fast.length && left !== Infinity;
      pick = pool.slice().sort((a, b) => a.items[st.id] - b.items[st.id] || a.lead - b.lead)[0];
      qty = daily > 0 ? Math.max(1, Math.ceil(daily * (cover + pick.lead) - st.qty)) : Math.max(1, Math.ceil(st.min * 2 - st.qty));
    }
    return { st, daily, left, src: u.src, days: u.days, status, pick, qty, late, price: pick ? pick.items[st.id] : 0, base: st.cost || 0 };
  });
}
function proposals() {
  const g = {};
  stockPlan().filter((p) => p.pick).forEach((p) => { const o = g[p.pick.id] || (g[p.pick.id] = { sup: p.pick, lines: [], total: 0, saving: 0 }); o.lines.push(p); o.total += p.qty * p.price; o.saving += Math.max(0, (p.base - p.price) * p.qty); });
  return Object.values(g).sort((a, b) => a.sup.lead - b.sup.lead);
}

}
