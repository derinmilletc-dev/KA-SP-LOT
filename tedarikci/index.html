const dLeft=(iso)=>iso?Math.ceil((Date.parse(iso)-Date.parse(isoToday()))/864e5):null;
const fmt2=(n)=>Number(n).toLocaleString('tr-TR',{maximumFractionDigits:2});
const SPI=(n,s)=>{const P={home:'<path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/>',box:'<path d="M3 7l9-4 9 4-9 4zM3 7v10l9 4 9-4V7M12 11v10"/>',doc:'<path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h6M9 17h6"/>',truck:'<path d="M2 7h11v9H2zM13 10h4l3 3v3h-7"/><circle cx="6.5" cy="17.5" r="1.8"/><circle cx="16.5" cy="17.5" r="1.8"/>',pin:'<path d="M12 21s7-6.2 7-11a7 7 0 10-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',plus:'<path d="M12 5v14M5 12h14"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',tag:'<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.3"/>',alert:'<path d="M12 4l9 16H3zM12 10v4M12 17h.01"/>',search:'<circle cx="11" cy="11" r="6"/><path d="M16 16l5 5"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',up:'<path d="M12 19V6M6 11l6-6 6 6"/>',spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM18 16l.8 2.2L21 19l-2.2.8L18 22l-.8-2.2L15 19l2.2-.8z"/>'};return `<svg viewBox="0 0 24 24" width="${s||20}" height="${s||20}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]||''}</svg>`;};
function spToast(t,bad){let e=document.getElementById('sp-toast'); if(!e){e=document.createElement('div');e.id='sp-toast';document.body.appendChild(e);} e.textContent=t;e.className=bad?'bad on':'on';clearTimeout(spToast.t);spToast.t=setTimeout(()=>{e.className='';},2600);}
const unitLeft=(p)=>p.promo_pct>0&&(!p.promo_until||dLeft(p.promo_until)>=0);
function effPrice(p,qty){let pct=0;(p.tiers||[]).forEach(t=>{if(qty>=t.q&&t.p>pct)pct=t.p;});let v=Number(p.price)*(1-pct/100);if(unitLeft(p))v*=1-p.promo_pct/100;return v;}
function spMatch(name){const n=nrm(name); if(!n) return null; const L=SPS.prods.filter(p=>p.active!==false&&p.stock!=='yok');
  return L.find(p=>nrm(p.name)===n)||L.find(p=>{const a=nrm(p.name);return a&&(a.includes(n)||n.includes(a));})||null;}
function sktInfo(p){const d=dLeft(p.lot_exp); if(d==null) return p.shelf_days?['Raf ömrü '+p.shelf_days+' gün','mut']:null; if(d<0) return ['SKT geçti','bad']; if(d<=7) return ['SKT '+d+' gün','bad']; if(d<=30) return ['SKT '+d+' gün','warn']; return ['SKT '+d+' gün','ok'];}
function spDone(){const f=SPS.prof||{}; const h=Object.values(f.hours||{}).some(x=>x&&x.o);
  return [['Telefon',!!f.phone,'profil'],['Adres ve konum',!!(f.address&&f.lat!=null),'profil'],['Çalışma saatleri',h,'profil'],['Teslimat günleri ve koşulları',!!((f.delivery_days||[]).length&&f.cutoff),'profil'],['En az 5 ürün',SPS.prods.length>=5,'urun']];}
async function spLoad(){

/* ---- ÖZET ---- */
function spOzet(){
  const dn=spDone(), ok=dn.filter(x=>x[1]).length, pct=Math.round(ok/dn.length*100);
  const act=SPS.prods.filter(p=>p.active!==false);
  const skt=act.filter(p=>p.lot_exp&&dLeft(p.lot_exp)<=14&&dLeft(p.lot_exp)>=0&&p.stock!=='yok');
  const old=act.filter(p=>p.updated_at&&(Date.now()-Date.parse(p.updated_at))/864e5>30);
  const can=SPS.rfqs.filter(r=>r.lines.every(l=>spMatch(l.name))&&!SPS.quotes.some(q=>q.rfq_id===r.id));
  const pend=SPS.orders.filter(o=>o.status==='gonderildi');
  const tips=[];
  if(pend.length) tips.push(['truck','warn',pend.length+' sipariş onayını bekliyor.','Siparişlere git','siparis']);
  if(can.length) tips.push(['spark','ok',can.length+' teklif isteğinin tüm ürünleri katalogunda var. Fiyatlar tek dokunuşla dolar.','Teklifleri aç','teklif']);
  else if(SPS.rfqs.length) tips.push(['doc','info',SPS.rfqs.length+' açık teklif isteği var.','Teklifleri aç','teklif']);
  if(skt.length) tips.push(['clock','warn',skt.length+' ürünün SKT\'si 14 günden az: '+skt.slice(0,2).map(p=>p.name).join(', ')+(skt.length>2?' ve diğerleri':'')+'. Kampanya yapmayı düşün.','Ürünleri gör','urun:skt']);
  if(!(SPS.prof.lat!=null)) tips.push(['pin','info','Konumunu ekle. İşletmeler yakındaki tedarikçileri önce görür.','Konum ekle','profil']);
  if(!Object.values(SPS.prof.hours||{}).some(x=>x&&x.o)) tips.push(['clock','info','Çalışma saatlerini yaz. İşletmeler ne zaman arayabileceğini bilsin.','Saatleri yaz','profil']);
  if(old.length) tips.push(['tag','info',old.length+' ürünün fiyatı 30 günden uzun süredir güncellenmedi.','Toplu fiyat güncelle','bulk']);
  if(SPS.prods.length<5) tips.push(['box','info','Katalogda '+SPS.prods.length+' ürün var. Ürün ekledikçe teklifler kendiliğinden dolar.','Ürün ekle','pnew']);
  return `<div class="sp-hero"><div class="sp-ring" style="--p:${pct}"><b>%${pct}</b></div><div><h1>${pct>=100?'Profilin hazır':'Profilini tamamla'}</h1><p>${pct>=100?'İşletmeler seni konumuna, saatlerine ve ürünlerine göre bulabilir.':'Eksikleri tamamladıkça işletmeler seni daha kolay bulur.'}</p></div></div>
  <div class="sp-chk">${dn.map(d=>`<button data-sp="go" data-v="${d[2]}" class="${d[1]?'ok':''}"><i>${d[1]?SPI('check',14):''}</i>${d[0]}</button>`).join('')}</div>
  <div class="sp-kpi"><div><b>${act.length}</b><span>aktif ürün</span></div><div><b>${SPS.rfqs.length}</b><span>açık teklif isteği</span></div><div><b>${pend.length}</b><span>bekleyen sipariş</span></div></div>
  <h2 class="sp-h">Önerilenler</h2>${tips.length?tips.map(t=>`<div class="sp-tip ${t[1]}"><span class="sp-ti">${SPI(t[0],18)}</span><p>${esc(t[2])}</p><button data-sp="go" data-v="${t[4]}">${esc(t[3])}</button></div>`).join(''):`<div class="sp-empty">${SPI('check',28)}<b>Her şey yolunda</b><span>Şu an yapılacak bir şey yok.</span></div>`}`;
}

    <div class="sp-two2"><div><label>Birim</label><select id="pf-u">${SP_UNITS.map(u=>`<option ${(p.unit||'kg')===u?'selected':''}>${u}</option>`).join('')}</select></div><div><label>Birim fiyat (₺)</label><input id="pf-p" inputmode="decimal" value="${p.price||''}" placeholder="0"></div></div>
    <div class="sp-two2"><div><label>KDV %</label><select id="pf-v">${[0,1,10,20].map(v=>`<option ${(p.vat!=null?p.vat:10)===v?'selected':''}>${v}</option>`).join('')}</select></div><div><label>En az sipariş</label><input id="pf-m" inputmode="decimal" value="${p.min_qty||''}" placeholder="1"></div></div>
    <label>Stok durumu</label><div class="sp-chips2" id="pf-st">${[['var','Stokta'],['az','Azaldı'],['yok','Tükendi']].map(o=>`<button type="button" data-sp="pst" data-v="${o[0]}" class="${(p.stock||'var')===o[0]?'on':''}">${o[1]}</button>`).join('')}</div>
    <div class="sp-two2"><div><label>Raf ömrü (gün)</label><input id="pf-sh" inputmode="numeric" value="${p.shelf_days||''}" placeholder="Örn: 180"></div><div><label>Parti SKT</label><input type="date" id="pf-lx" value="${esc(p.lot_exp||'')}"></div></div>
    <label>Miktara göre indirim</label><div id="pf-tiers">${tiers.map(spTierRow).join('')}</div><button type="button" class="sp-link" data-sp="addtier">+ Kademe ekle</button>
    <div class="sp-two2"><div><label>Kampanya indirimi %</label><input id="pf-pp" inputmode="decimal" value="${p.promo_pct||''}" placeholder="0"></div><div><label>Kampanya bitişi</label><input type="date" id="pf-pu" value="${esc(p.promo_until||'')}"></div></div>
    <label>Not</label><input id="pf-nt" value="${esc(p.note||'')}" placeholder="İşletmeler görür"><p class="err" id="msg"></p>
    <div class="sp-two">${p.id?`<button class="sp-sec bad" data-sp="pdel" data-id="${p.id}">Sil</button>`:'<button class="sp-sec" data-sp="sclose">Vazgeç</button>'}<button class="sp-pri" data-sp="psave" data-id="${p.id||''}">Kaydet</button></div>`;}
  else if(s.t==='bulk'){t='Toplu fiyat güncelle'; b=`<p class="sp-d">Seçtiğin ürünlerin fiyatını yüzde olarak değiştir. Artış için artı, indirim için eksi yaz.</p><label>Değişim %</label><input id="bk-p" inputmode="decimal" placeholder="Örn: 8 ya da -5"><label>Kapsam</label><select id="bk-c"><option value="">Tüm ürünler</option>${[...new Set(SPS.prods.map(p=>p.category).filter(Boolean))].map(c=>`<option>${esc(c)}</option>`).join('')}</select><p class="err" id="msg"></p><button class="sp-pri sp-wide" data-sp="bkgo">Uygula</button>`;}
  else if(s.t==='import'){t='Toplu ürün yükle'; b=`<p class="sp-d">Her satıra bir ürün yaz: <b>ad; birim; fiyat; marka; kategori</b>. Marka ve kategori isteğe bağlı. Excel'den kopyalayıp yapıştırabilirsin.</p><textarea id="im-t" rows="8" placeholder="Un (tip 550); kg; 28,5; Söke; Un ve tahıl&#10;Süt (tam yağlı); L; 32"></textarea><p class="sp-d" id="im-c"></p><p class="err" id="msg"></p><button class="sp-pri sp-wide" data-sp="imgo">Ürünleri ekle</button>`;}
  return `<div class="sp-ov" data-sp="sclose"><div class="sp-sh"><div class="sp-shh"><h3>${t}</h3><button data-sp="sclose" aria-label="Kapat">${SPI('x',20)}</button></div>${b}</div></div>`;}
function spTierRow(t){return `<div class="sp-tr"><input class="tq" inputmode="decimal" placeholder="Miktar ≥" value="${t&&t.q||''}"><input class="tp" inputmode="decimal" placeholder="% indirim" value="${t&&t.p||''}"><button type="button" data-sp="rmtier" aria-label="Kademeyi sil">${SPI('x',16)}</button></div>`;}
/* ---- İŞLEMLER ---- */
const $v=(id)=>{const e=document.getElementById(id);return e?e.value.trim():'';};
const spErr=(t)=>{const e=document.getElementById('msg'); if(e){e.textContent=t||'';}};
const spDb=(r)=>r&&r.error?r.error.message:'';
const SPA={
  tab:(el)=>{SPS.tab=el.dataset.v;SPS.sheet=null;spRender();window.scrollTo(0,0);},
  go:(el)=>{const v=el.dataset.v; if(v==='bulk'){SPS.sheet={t:'bulk'};spRender(true);return;} if(v==='pnew'){SPS.tab='urun';SPS.sheet={t:'prod',p:{}};spRender();return;} const [tab,cat]=v.split(':'); SPS.tab=tab; if(cat) SPS.cat=cat; spRender(); window.scrollTo(0,0);},
  cat:(el)=>{SPS.cat=el.dataset.v;spRender(true);},
  pnew:()=>{SPS.sheet={t:'prod',p:{}};spRender(true);},
  pedit:(el)=>{SPS.sheet={t:'prod',p:SPS.prods.find(p=>p.id===el.dataset.id)||{}};spRender(true);},
  sclose:()=>{SPS.sheet=null;spRender(true);},
  bulk:()=>{SPS.sheet={t:'bulk'};spRender(true);}, import:()=>{SPS.sheet={t:'import'};spRender(true);},
  pst:(el)=>{document.querySelectorAll('#pf-st button').forEach(b=>b.classList.toggle('on',b===el));},
  addtier:()=>{const d=document.createElement('div');d.innerHTML=spTierRow(null);document.getElementById('pf-tiers').appendChild(d.firstChild);},
  rmtier:(el)=>{el.closest('.sp-tr').remove();},
  psave:async(el)=>{ if(SPS.busy) return; const name=$v('pf-n'), price=nz($v('pf-p')); if(!name) return spErr('Ürün adını yaz.'); if(!(price>0)) return spErr('Birim fiyatı yaz.');
    const tiers=[...document.querySelectorAll('#pf-tiers .sp-tr')].map(r=>({q:nz(r.querySelector('.tq').value),p:nz(r.querySelector('.tp').value)})).filter(t=>t.q>0&&t.p>0&&t.p<100);
    const pp=nz($v('pf-pp')); if(pp<0||pp>=100) return spErr('Kampanya yüzdesi 0 ile 99 arasında olmalı.');
    const st=document.querySelector('#pf-st .on'); const row={supplier_id:SUP.id,name,brand:$v('pf-b')||null,category:$v('pf-c')||null,unit:$v('pf-u')||'kg',price,vat:Number($v('pf-v')),min_qty:nz($v('pf-m'))||1,stock:st?st.dataset.v:'var',shelf_days:nz($v('pf-sh'))||null,lot_exp:$v('pf-lx')||null,tiers,promo_pct:pp,promo_until:$v('pf-pu')||null,note:$v('pf-nt')||null,updated_at:new Date().toISOString()};
    SPS.busy=true; const id=el.dataset.id; const r=id?await sb.from('supplier_products').update(row).eq('id',id):await sb.from('supplier_products').insert(row); SPS.busy=false;
    if(spDb(r)) return spErr(/relation|schema cache/i.test(spDb(r))?'Katalog kurulumu eksik. İşletme sahibi SQL dosyasını çalıştırmalı.':spDb(r));
    SPS.sheet=null; await spReloadProds(); spToast(id?'Ürün güncellendi.':'Ürün eklendi.');},
  pdel:async(el)=>{ if(!confirm('Bu ürün silinsin mi?')) return; const r=await sb.from('supplier_products').delete().eq('id',el.dataset.id); if(spDb(r)) return spErr(spDb(r)); SPS.sheet=null; await spReloadProds(); spToast('Ürün silindi.');},
  ptoggle:async(el)=>{const p=SPS.prods.find(x=>x.id===el.dataset.id); if(!p) return; const r=await sb.from('supplier_products').update({active:p.active===false,updated_at:new Date().toISOString()}).eq('id',p.id); if(spDb(r)) return spToast(spDb(r),1); await spReloadProds(); spToast(p.active===false?'Ürün satışa açıldı.':'Ürün satışa kapatıldı.');},
  stock:async(el)=>{const p=SPS.prods.find(x=>x.id===el.dataset.id); if(!p) return; const nx={var:'az',az:'yok',yok:'var'}[p.stock||'var']; const r=await sb.from('supplier_products').update({stock:nx}).eq('id',p.id); if(spDb(r)) return spToast(spDb(r),1); p.stock=nx; spRender(true);},
  bkgo:async()=>{const pct=nz($v('bk-p')); if(!pct||pct<=-90||pct>300) return spErr('Geçerli bir yüzde yaz. Örn: 8 ya da -5'); const c=$v('bk-c'); const L=SPS.prods.filter(p=>!c||p.category===c); if(!L.length) return spErr('Bu kapsamda ürün yok.');
    const rs=await Promise.all(L.map(p=>sb.from('supplier_products').update({price:Math.round(p.price*(1+pct/100)*100)/100,updated_at:new Date().toISOString()}).eq('id',p.id))); const bad=rs.find(spDb); if(bad) return spErr(spDb(bad)); SPS.sheet=null; await spReloadProds(); spToast(L.length+' ürünün fiyatı güncellendi.');},
  imgo:async()=>{const rows=$v('im-t').split(/\n/).map(l=>l.split(/;|\t/).map(x=>x.trim())).filter(c=>c[0]&&c.length>=3&&nz(c[2])>0); if(!rows.length) return spErr('Okunabilen satır yok. Her satır: ad; birim; fiyat');
    const ins=rows.map(c=>({supplier_id:SUP.id,name:c[0],unit:SP_UNITS.includes(c[1])?c[1]:(c[1]||'kg'),price:nz(c[2]),brand:c[3]||null,category:SP_CATS.includes(c[4])?c[4]:(c[4]||null)})); const r=await sb.from('supplier_products').insert(ins); if(spDb(r)) return spErr(spDb(r)); SPS.sheet=null; await spReloadProds(); spToast(ins.length+' ürün eklendi.');},
  fill:(el)=>{const i=el.closest('.sp-ql').querySelector('[data-qi]'); i.value=el.dataset.v; spQTot(el.closest('[data-r]'));},
  fillall:(el)=>{const c=el.closest('[data-r]'); c.querySelectorAll('.sp-ql').forEach(l=>{const b=l.querySelector('.sp-fill'),i=l.querySelector('[data-qi]'); if(b&&!nz(i.value)) i.value=b.dataset.v;}); spQTot(c);},
  qsend:async(el)=>{const c=el.closest('[data-r]'),prices={}; c.querySelectorAll('[data-qi]').forEach(i=>{const v=nz(i.value); if(v>0) prices[i.dataset.i]=v;}); const e=c.querySelector('[data-e]'); e.className='err'; if(!Object.keys(prices).length){e.textContent='En az bir fiyat yaz.';return;}
    const r=await sb.from('quotes').upsert({rfq_id:c.dataset.r,supplier_id:SUP.id,prices},{onConflict:'rfq_id,supplier_id'}); if(spDb(r)){e.textContent=spDb(r);return;} const q=SPS.quotes.find(x=>x.rfq_id===c.dataset.r); if(q) q.prices=prices; else SPS.quotes.push({rfq_id:c.dataset.r,supplier_id:SUP.id,prices}); spToast('Teklif gönderildi.'); spRender(true);},
  ook:async(el)=>{const r=await sb.from('orders').update({status:'onaylandi'}).eq('id',el.dataset.id); if(spDb(r)) return spToast(spDb(r),1); const o=SPS.orders.find(x=>x.id===el.dataset.id); if(o) o.status='onaylandi'; spToast('Sipariş onaylandı.'); spRender(true);},
  geo:(el)=>{ if(!navigator.geolocation) return spToast('Bu cihaz konumu desteklemiyor.',1); const t=document.getElementById('pf-gt'); if(t) t.textContent='Konum alınıyor…';
    navigator.geolocation.getCurrentPosition(p=>{SPS.geo={lat:Math.round(p.coords.latitude*1e6)/1e6,lng:Math.round(p.coords.longitude*1e6)/1e6}; if(t) t.innerHTML='Konum alındı (yaklaşık '+Math.round(p.coords.accuracy)+' m). Kaydetmeyi unutma.';},
      (er)=>{ if(t) t.textContent=er&&er.code===1?'Konum izni verilmedi. Tarayıcı ayarlarından izin verip tekrar dene.':'Konum alınamadı. Açık alanda tekrar dene.'; },{enableHighAccuracy:true,timeout:12000,maximumAge:0}); },
  hpre:(el)=>{const v=el.dataset.v; const h={}; SP_DAYS.forEach(d=>{const wk=['1','2','3','4','5'].includes(d[0]); const sat=d[0]==='6'; if(v==='all') h[d[0]]={o:'07:00',c:'20:00'}; else if(wk||(v==='wk6'&&sat)) h[d[0]]={o:'08:00',c:'18:00'}; else h[d[0]]=null;}); SPS.hrs=h; document.querySelectorAll('.sp-hr').forEach(r=>{const x=h[r.dataset.d]; const c=r.querySelector('.hon'); c.checked=!!x; r.querySelectorAll('input[type=time]').forEach(i=>i.disabled=!x); if(x){r.querySelector('.ho').value=x.o; r.querySelector('.hc').value=x.c;}});},
  dd:(el)=>{const v=el.dataset.v; SPS.dd=SPS.dd.includes(v)?SPS.dd.filter(x=>x!==v):[...SPS.dd,v]; el.classList.toggle('on');},
  psave2:async(el)=>{ if(SPS.busy) return; const hours={}; document.querySelectorAll('.sp-hr').forEach(r=>{const on=r.querySelector('.hon').checked; hours[r.dataset.d]=on?{o:r.querySelector('.ho').value,c:r.querySelector('.hc').value}:null;});
    const g=SPS.geo||(SPS.prof.lat!=null?{lat:SPS.prof.lat,lng:SPS.prof.lng}:{lat:null,lng:null});
    const row={supplier_id:SUP.id,phone:$v('pf-phone')||null,about:$v('pf-about')||null,address:$v('pf-addr')||null,city:$v('pf-city')||null,district:$v('pf-dist')||null,lat:g.lat,lng:g.lng,radius_km:nz($v('pf-rad'))||25,hours,delivery_days:SPS.dd.map(Number),cutoff:$v('pf-cut')||null,lead_days:nz($v('pf-lead')),min_order:nz($v('pf-min')),delivery_fee:nz($v('pf-fee')),free_over:nz($v('pf-free')),pay_terms:Number($v('pf-pay')||0),updated_at:new Date().toISOString()};
    SPS.busy=true; el.disabled=true; const r=await sb.from('supplier_profiles').upsert(row,{onConflict:'supplier_id'}); SPS.busy=false; el.disabled=false;
    if(spDb(r)) return spErr(/relation|schema cache/i.test(spDb(r))?'Profil kurulumu eksik. İşletme sahibi SQL dosyasını çalıştırmalı.':spDb(r));
    SPS.prof=row; SPS.geo=null; spToast('Profil kaydedildi.'); spRender(true);}
};
async function spReloadProds(){const r=await sb.from('supplier_products').select('*').eq('supplier_id',SUP.id).order('created_at',{ascending:false}); if(!r.error) SPS.prods=r.data||[]; spRender(true);}
if(!window.__spOn){window.__spOn=1;
  document.addEventListener('click',(e)=>{if(MODE!=='sup') return; const el=e.target.closest('[data-sp]'); if(!el) return; if(el.classList.contains('sp-ov')&&e.target!==el) return; const f=SPA[el.dataset.sp]; if(f) f(el,e); });
  document.addEventListener('change',(e)=>{if(MODE!=='sup') return; const t=e.target; if(t.classList&&t.classList.contains('hon')){const r=t.closest('.sp-hr'); r.querySelectorAll('input[type=time]').forEach(i=>i.disabled=!t.checked);} if(t.id==='pf-rad'){const v=document.getElementById('pf-rv'); if(v) v.textContent=t.value;}});
  document.addEventListener('input',(e)=>{const t=e.target; if(t.id==='pf-rad'){const v=document.getElementById('pf-rv'); if(v) v.textContent=t.value;} if(t.id==='im-t'){const n=t.value.split(/\n/).map(l=>l.split(/;|\t/).map(x=>x.trim())).filter(c=>c[0]&&c.length>=3&&nz(c[2])>0).length; const c=document.getElementById('im-c'); if(c) c.textContent=n?n+' ürün okundu.':'';}});
}
sb.auth.onAuthStateChange((ev)=>{ if(ev==='SIGNED_OUT') loginView(); });
if(DEMO){ME={id:'demo'};SUP={id:'s1',business_id:'b1',name:'Anadolu Un (deneme)'};MODE='sup';supView();}else boot();
</script></body></html>
