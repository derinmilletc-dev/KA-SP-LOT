function spResize(file){return new Promise((ok,no)=>{const fr=new FileReader(); fr.onerror=()=>no(new Error('Dosya okunamadı.')); fr.onload=()=>{const im=new Image(); im.onerror=()=>no(new Error('Görsel açılamadı.')); im.onload=()=>{const M=900; const k=Math.min(1,M/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k); c.getContext('2d').drawImage(im,0,0,c.width,c.height); c.toBlob(b=>b?ok({blob:b,url:c.toDataURL('image/jpeg',.82)}):no(new Error('Küçültülemedi.')),'image/jpeg',.82);}; im.src=fr.result;}; fr.readAsDataURL(file);});}
async function spPhUpload(files){const room=4-SPPH.length; const L=[...files].slice(0,room); if(!L.length) return spToast('En fazla 4 fotoğraf eklenir.',1); spToast('Fotoğraf yükleniyor…');
  for(const f of L){try{const r=await spResize(f); if(DEMO){SPPH.push(r.url);} else {const path=ME.id+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.jpg'; const u=await sb.storage.from('product-photos').upload(path,r.blob,{contentType:'image/jpeg',upsert:false}); if(u.error) throw u.error; SPPH.push(sb.storage.from('product-photos').getPublicUrl(path).data.publicUrl);} }catch(e){spToast(/bucket|not found|policy/i.test(String(e&&e.message))?'Fotoğraf deposu kurulu değil. kaispilot_toptanci2.sql çalıştır.':String(e&&e.message||'Yüklenemedi'),1);}}

const lineMatch=(name)=>{const n=nrm(name); if(!n) return null; return SPS.prods.find(p=>nrm(p.name)===n)||SPS.prods.find(p=>{const a=nrm(p.name);return a&&(a.includes(n)||n.includes(a));})||null;};

function spVel(pid){const since=Date.now()-30*864e5; return SPS.books.slog.filter(s=>s.pid===pid&&s.type==='cikis'&&Date.parse(s.date)>=since).reduce((a,s)=>a+(Number(s.qty)||0),0)/30;}
function spStk(p,R){R=R||spRes(); const qty=Number(p.qty)||0; const res=(R[p.id]||[]).reduce((a,r)=>a+r.qty,0); const avail=qty-res; const vel=spVel(p.id); const cover=vel>0?Math.max(0,avail)/vel:null; const min=Number(p.min_stock)||0;
  const tracked=qty>0||min>0||SPS.books.slog.some(s=>s.pid===p.id); const dl=p.lot_exp?dLeft(p.lot_exp):null;
  const short=tracked&&res>0&&avail<0, crit=tracked&&!short&&(qty<=0||(min>0&&qty<=min)), over=cover!=null&&cover>90&&qty>0;
  const unsold=(dl!=null&&dl>=0&&qty>0)?(vel>0?Math.max(0,qty-vel*dl):qty):0; const sktRisk=unsold>0&&dl<=30;
  return {qty,res,avail,vel,cover,min,tracked,short,crit,over,sktRisk,unsold,dl,list:R[p.id]||[],val:qty*(Number(p.cost)||Number(p.price)||0)};}
async function spMove(pid,type,qty,who,note){const p=SPS.prods.find(x=>x.id===pid); if(!p) throw new Error('Ürün bulunamadı.'); qty=Number(qty); if(!(qty>=0)) throw new Error('Miktarı yaz.');
  const cur=Number(p.qty)||0; let nq=cur, lg=qty; if(type==='giris') nq=cur+qty; else if(type==='cikis'||type==='fire'){ nq=Math.max(0,cur-qty); lg=cur-nq; } else if(type==='sayim'){ nq=qty; lg=nq-cur; }
  const min=Number(p.min_stock)||0; const st=nq<=0?'yok':(min>0&&nq<=min?'az':'var');
  const r=await sb.from('supplier_products').update({qty:nq,stock:st,updated_at:new Date().toISOString()}).eq('id',pid); if(r&&r.error) throw new Error(r.error.message);
  p.qty=nq; p.stock=st; SPS.books.slog.push({id:bid(),pid,date:new Date().toISOString(),type,qty:Math.abs(lg),who:who||'',note:note||''}); SPS.books.slog=SPS.books.slog.slice(-400); spSaveBooks(); return nq;}

/* ---- Teslimat maliyeti ve kârlılık ---- */
const spHav=(a,b,c,d)=>{const R=6371,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,h=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2; return 2*R*Math.asin(Math.sqrt(h));};
const bizName=(id)=>((SPS.bizs||{})[id]||SPS.biz||{}).name||'İşletme';
const supIdFor=(bid)=>{const r=(SPS.sups||[]).find(x=>x.business_id===bid); return r?r.id:SUP.id;};
function spBizLabel(){const n=(SPS.sups||[]).length; return n>1?n+' işletme için çalışıyorsun':esc(SPS.biz.name)+' için çalışıyorsun';}
function spVeh(){const v=(SPS.prof&&SPS.prof.vehicle)||{}; return {name:v.name||'',fuel:v.fuel||'dizel',l100:Number(v.l100)||0,fp:Number(v.fp)||0,drv:Number(v.drv)||0,wear:Number(v.wear)||0,spd:Number(v.spd)||40,minD:Number(v.minD)||0};}
const spKmCost=(v)=>v.l100/100*v.fp+v.wear;
const spVehOK=(v)=>v.l100>0&&v.fp>0;
function spPt(bid){const f=SPS.prof||{}, b=(SPS.bizs||{})[bid]; if(f.lat==null||!b||b.lat==null) return null; return {a:Number(f.lat),b:Number(f.lng),c:Number(b.lat),d:Number(b.lng)};}
function spKm(bid){const p=spPt(bid); return p?Math.round(spHav(p.a,p.b,p.c,p.d)*1.3*10)/10:null;}
function spDeliv(bid){const v=spVeh(), km=spKm(bid); if(km==null||!spVehOK(v)) return null; const rt=km*2, hrs=rt/v.spd+0.25; return {km,rt,hrs,fuel:rt*v.l100/100*v.fp,wear:rt*v.wear,drv:hrs*v.drv,cost:rt*spKmCost(v)+hrs*v.drv};}
function spMargin(){const L=SPS.prods.filter(p=>p.active!==false&&p.cost>0&&p.price>0); if(!L.length) return null; return L.reduce((a,p)=>a+(1-p.cost/p.price),0)/L.length;}
function spOrderEcon(o){const d=spDeliv(o.business_id), v=spVeh(), rev=Number(o.total)||0, f=SPS.prof||{}; let cost=0,miss=0; (o.lines||[]).forEach(l=>{const p=lineMatch(l.name); if(p&&p.cost>0) cost+=p.cost*l.qty; else miss++;}); const fee=(f.delivery_fee>0&&!(f.free_over>0&&rev>=f.free_over))?Number(f.delivery_fee):0;
  if(!d) return null; const net=rev+fee-cost-d.cost; const all=miss===(o.lines||[]).length; const lvl=all?'mut':net<0?'bad':net<0.05*rev?'warn':'ok'; const m=spMargin(); const sugMin=m&&m>0.06?Math.ceil(d.cost/(m-0.05)/10)*10:null; return {d,rev,cost,miss,fee,net,lvl,all,below:v.minD>0&&rev<v.minD,minD:v.minD,sugMin};}
function spEconHTML(o){const e=spOrderEcon(o); if(!e){const v=spVeh(); return !spVehOK(v)?`<div class="sp-ec mut"><span>Teslimat maliyeti için profilinde araç ve yakıt bilgisini gir.</span></div>`:(spPt(o.business_id)?'':`<div class="sp-ec mut"><span>Mesafe için ${esc(bizName(o.business_id))} konumunu kaydetmeli, sen de profilinde konum eklemelisin.</span></div>`);}
  const tag={ok:'Kârlı',warn:'Düşük kâr',bad:'Zararına',mut:'Maliyet yok'}[e.lvl];
  return `<div class="sp-ec ${e.lvl}"><div class="sp-ech"><b>${tag}</b><span>${fmt1(e.d.km)} km · ~${Math.round(e.d.hrs*60)} dk gidiş-dönüş</span></div>
  <div class="sp-ecl"><span>Satış</span><span>${tl(e.rev)}${e.fee?' + '+tl(e.fee)+' teslimat':''}</span></div>${e.all?'':`<div class="sp-ecl"><span>Ürün maliyeti</span><span>${tl(e.cost)}${e.miss?' (eksik: '+e.miss+')':''}</span></div>`}<div class="sp-ecl"><span>Teslimat maliyeti</span><span>${tl(e.d.cost)}</span></div>
  ${e.all?'':`<div class="sp-ecl tot"><span>Tahmini net</span><span>${tl(e.net)}</span></div>`}
  ${e.below?`<p class="sp-ecn bad">Minimum teslimat tutarının (${tl(e.minD)}) altında.</p>`:''}${e.lvl==='bad'&&e.sugMin?`<p class="sp-ecn">Bu mesafe için en az ${tl(e.sugMin)} sipariş mantıklı olur.</p>`:''}</div>`;}
const fmt1=(n)=>Number(n).toLocaleString('tr-TR',{maximumFractionDigits:1});
/* rota: en yakın komşu */
function spRoute(){const live=SPS.orders.filter(o=>['gonderildi','onaylandi'].includes(o.status)); const f=SPS.prof||{}; const v=spVeh(); if(!live.length||f.lat==null||!spVehOK(v)) return null;
  const byB={}; live.forEach(o=>{const b=(SPS.bizs||{})[o.business_id]; if(!b||b.lat==null) return; (byB[o.business_id]=byB[o.business_id]||{id:o.business_id,b,orders:[],rev:0,sub:0}); const x=byB[o.business_id]; x.orders.push(o); const e=spOrderEcon(o); x.rev+=Number(o.total)||0; x.sub+=e?(e.rev+e.fee-e.cost):0; x.hasAll=(x.hasAll||0)+(e&&e.all?1:0);});
  let rest=Object.values(byB); if(!rest.length) return null; const stops=[]; let cur={a:Number(f.lat),b:Number(f.lng)}, km=0;
  while(rest.length){let bi=0,bd=1e9; rest.forEach((s,i)=>{const d=spHav(cur.a,cur.b,Number(s.b.lat),Number(s.b.lng)); if(d<bd){bd=d;bi=i;}}); const s=rest.splice(bi,1)[0]; km+=bd*1.3; stops.push(s); cur={a:Number(s.b.lat),b:Number(s.b.lng)};}
  km+=spHav(cur.a,cur.b,Number(f.lat),Number(f.lng))*1.3; km=Math.round(km*10)/10; const hrs=km/v.spd+0.25*stops.length; const cost=km*spKmCost(v)+hrs*v.drv;
  const sep=stops.reduce((a,s)=>{const d=spDeliv(s.id); return a+(d?d.cost:0);},0); const sub=stops.reduce((a,s)=>a+s.sub,0); return {stops,km,hrs,cost,sep,save:Math.max(0,sep-cost),net:sub-cost,rev:stops.reduce((a,s)=>a+s.rev,0)};}
function spRouteHTML(){const r=spRoute(); if(!r) return ''; const lvl=r.net<0?'bad':'ok';
  return `<div class="sp-card sp-rt"><div class="sp-ch"><b>Teslimat rotası</b><span class="sp-b ${lvl==='ok'?'ok':'bad'}">${lvl==='ok'?'Kârlı':'Zararına'}</span></div>
  <p class="sp-d">${r.stops.length} durak · ${fmt1(r.km)} km · ~${Math.round(r.hrs*60)} dk</p><div class="sp-rs"><i>Depo</i>${r.stops.map(s=>`<i>${esc(s.b.name||'İşletme')}</i>`).join('')}<i>Depo</i></div>
  <div class="sp-ecl"><span>Satış</span><span>${tl(r.rev)}</span></div><div class="sp-ecl"><span>Rota maliyeti</span><span>${tl(r.cost)}</span></div><div class="sp-ecl tot"><span>Tahmini net</span><span>${tl(r.net)}</span></div>
  ${r.stops.length>1&&r.save>1?`<p class="sp-ecn ok">Siparişleri tek rotada götürürsen ayrı ayrı gitmeye göre yaklaşık ${tl(r.save)} tasarruf edersin.</p>`:''}</div>`;}
function spVehCard(){const v=spVeh(); const kc=spKmCost(v); const m=spMargin();
  return `<div class="sp-sec-h"><h2>Araç ve teslimat maliyeti</h2></div><div class="sp-card"><p class="sp-d">Siparişin teslimata değip değmediğini hesaplamak için. Bu bilgi sadece sende kalır, işletme görmez.</p>

  <div class="sp-two2"><div><label>Sürücü (₺/saat)</label><input id="vh-drv" inputmode="decimal" value="${v.drv||''}" placeholder="0"></div><div><label>Ortalama hız (km/s)</label><input id="vh-spd" inputmode="decimal" value="${v.spd||40}"></div></div>

/* ---- cari mutabakat ---- */
const RC_ST={bekliyor:['Onay bekliyor','warn'],onaylandi:['Onaylandı','ok'],itiraz:['İtiraz var','bad']};
function rcCompute(orders,pays,period){const end=period+'-31'; const L=[]; let dis=0;
  orders.filter(o=>['onaylandi','teslim'].includes(o.status)&&(o.created_at||'').slice(0,10)<=end).forEach(o=>{const d=(o.created_at||'').slice(0,10); L.push({d,t:'Sipariş · '+(o.lines||[]).length+' kalem',a:Number(o.total)||0}); if(o.recv&&o.recv.short>0){if(o.recv_status==='kabul') L.push({d,t:'Alacak notu (eksik teslim)',a:-Number(o.recv.short)}); else dis+=Number(o.recv.short);}});
  pays.filter(p=>String(p.pay_date||'')<=end).forEach(p=>L.push({d:String(p.pay_date),t:'Ödeme'+(p.note?' · '+p.note:''),a:-Number(p.amt),pay:true,by:p.by_side}));
  L.sort((a,b)=>a.d>b.d?1:-1); const carried=L.filter(x=>x.d.slice(0,7)<period).reduce((a,x)=>a+x.a,0); const lines=L.filter(x=>x.d.slice(0,7)===period); const bal=Math.round(L.reduce((a,x)=>a+x.a,0)*100)/100; return {lines,carried:Math.round(carried*100)/100,bal,dis};}
const rcMonL=(p)=>{const a=p.split('-'); return ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'][Number(a[1])-1]+' '+a[0];};
const rcShift=(p,n)=>{const a=p.split('-').map(Number); const d=new Date(Date.UTC(a[0],a[1]-1+n,1)); return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0');};
function rcOrders(sid){return SPS.orders.filter(o=>o.supplier_id===sid);}
function rcPays(sid){return (SPS.pays||[]).filter(p=>p.supplier_id===sid);}
function spRcCard(){const rows=(SPS.sups||[]); if(!rows.length||!SPS.orders.length) return ''; const per=isoToday().slice(0,7);
  return `<div class="sp-card"><div class="sp-ch"><b>Cari mutabakat</b></div><p class="sp-d">Ay sonunda ekstreyi işletmeyle onaylayın. Fark çıkarsa satır satır bakılır.</p>${rows.map(r=>{const c=rcCompute(rcOrders(r.id),rcPays(r.id),per); const rec=(SPS.recons||[]).find(x=>x.supplier_id===r.id&&x.period===per); const st=rec?RC_ST[rec.status]:null; const wait=rec&&rec.status==='bekliyor'&&rec.sent_by==='isletme';

  const total=Math.round(lines.reduce((a,l)=>a+l.qty*l.price,0)*100)/100; const note=($v('sn-n')||'').slice(0,120); SPS.busy=true; el.disabled=true;
  const row={business_id:bid,supplier_id:supIdFor(bid),lines,total,status:'taslak'}; const r=await sb.from('orders').insert(row).select(); SPS.busy=false; el.disabled=false;

const SD_MON=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'], SD_DAY=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
function spDayPlan(){const T=isoToday(), I=[]; const R=spRes();
  SPS.orders.filter(o=>o.status==='gonderildi').forEach(o=>{let miss=0; (o.lines||[]).forEach(l=>{const p=lineMatch(l.name); if(p&&spStk(p,R).avail<0) miss++;}); const e=spOrderEcon(o);
    I.push({p:miss?1:2,rail:miss?'bad':'warn',t:bizName(o.business_id),m:tl(o.total)+' · '+(miss?miss+' üründe stok yetmiyor':'Stok yeterli')+(e?' · '+fmt1(e.d.km)+' km'+(e.all?'':' · net '+tl(e.net)):''),a:`<button data-sp="ook" data-id="${o.id}">Onayla</button>`});});
  SPS.orders.filter(o=>o.recv&&o.recv.short>0&&!o.recv_status).forEach(o=>I.push({p:0,rail:'bad',t:'Eksik teslim bildirimi · '+tl(o.recv.short),m:bizName(o.business_id)+' cevabını bekliyor',a:`<button data-sp="go" data-v="siparis">İncele</button>`}));
  (SPS.recons||[]).filter(r=>r.status==='bekliyor'&&r.sent_by==='isletme').forEach(r=>I.push({p:2,rail:'info',t:'Ekstre onayı bekliyor',m:bizName(r.business_id)+' · '+r.period+' · '+tl(r.bal),a:`<button data-sp="rcopen" data-id="${r.supplier_id}">Aç</button>`}));
  const can=SPS.rfqs.filter(r=>r.lines.every(l=>spMatch(l.name))&&!SPS.quotes.some(q=>q.rfq_id===r.id)); const open=SPS.rfqs.filter(r=>!SPS.quotes.some(q=>q.rfq_id===r.id));
  if(can.length) I.push({p:3,rail:'ok',t:can.length+' teklif isteği hazır',m:'Tüm ürünler katalogunda var, fiyatlar tek dokunuşla dolar',a:`<button data-sp="go" data-v="teklif">Doldur</button>`}); else if(open.length) I.push({p:4,rail:'info',t:open.length+' teklif isteği açık',m:'Bazı ürünler katalogunda yok',a:`<button data-sp="go" data-v="teklif">Aç</button>`});
  const od=SPS.books.cari.filter(c=>c.kind==='alacak'&&!c.paid&&c.due&&c.due<T); if(od.length){const s=od.reduce((a,c)=>a+Number(c.amt||0),0); const w=od.slice().sort((a,b)=>b.amt-a.amt)[0]; I.push({p:3,rail:'bad',t:'Vadesi geçen alacak · '+tl(s),m:od.length+' kayıt, en büyüğü '+w.who+' ('+Math.max(1,-dLeft(w.due))+' gün)',a:`<a class="sd-a" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent('Merhaba, '+w.who+' hesabında '+tl(w.amt)+' tutarındaki ödemenin vadesi geçti. Müsait olduğunuzda ödeme planını paylaşır mısınız?')}">Hatırlat</a>`});}
  const skt=SPS.prods.filter(p=>p.active!==false&&p.lot_exp&&dLeft(p.lot_exp)<=14&&dLeft(p.lot_exp)>=0&&p.stock!=='yok'&&!(typeof unitLeft==='function'&&unitLeft(p))); if(skt.length) I.push({p:4,rail:'warn',t:skt.length+' ürünün SKT\'si yaklaşıyor',m:skt.slice(0,2).map(p=>p.name.split(' (')[0]+' '+dLeft(p.lot_exp)+' gün').join(', ')+(skt.length>2?' …':''),a:`<button data-sp="sdskt">%15 kampanya</button>`});
  const low=SPS.prods.filter(p=>p.active!==false&&p.min_stock>0&&p.qty<=p.min_stock); if(low.length) I.push({p:5,rail:'warn',t:low.length+' ürün kritik stokta',m:low.slice(0,2).map(p=>p.name.split(' (')[0]+' '+fmt1(p.qty)+' '+p.unit).join(', '),a:`<button data-sp="stokgit">Stok</button>`});
  const dr=SPS.orders.filter(o=>o.status==='taslak').length; if(dr) I.push({p:6,rail:'info',t:dr+' sipariş işletme onayında',m:'Hazırladığın siparişler',a:`<button data-sp="go" data-v="siparis">Gör</button>`});
  const rt=spRoute(); if(rt) I.push({p:7,rail:rt.net<0?'bad':'ok',t:'Teslimat rotası · '+rt.stops.length+' durak',m:fmt1(rt.km)+' km · maliyet '+tl0(rt.cost)+' · net '+tl0(rt.net),a:`<button data-sp="go" data-v="siparis">Rota</button>`});
  return I.sort((a,b)=>a.p-b.p);}
SPA.sdskt=async()=>{const L=SPS.prods.filter(p=>p.active!==false&&p.lot_exp&&dLeft(p.lot_exp)<=14&&dLeft(p.lot_exp)>=0&&p.stock!=='yok'); if(!L.length) return; const until=new Date(Date.now()+6*864e5).toISOString().slice(0,10); try{for(const p of L) await spExec({type:'indirim_ayarla',args:{urun_id:p.id,kampanya_yuzde:15,kampanya_bitis:until}}); await spReloadProds(); spToast(L.length+' üründe 7 gün %15 kampanya başladı.');}catch(e){spToast(e.message||'Uygulanamadı',1);} spRender(true);};

  <div class="sp-ai-c"><div class="sp-ai-h"><span class="sp-ti">${SPI('spark',18)}</span><b>Kais'in günlük özeti</b></div>${SPS.sumBusy?'<p class="sp-d">Hazırlanıyor…</p>':a?`<div class="sp-ai-t">${spMd(a)}</div>`:'<p class="sp-d">Siparişlerine, SKT\'lere ve muhasebene bakıp kısa bir liste çıkarır.</p>'}<button class="sp-sec" data-sp="sum" ${SPS.sumBusy?'disabled':''}>${a?'Yenile':'Özet hazırla'}</button></div>

const CRC_T = (() => { const t = []; for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

    off += lh.length + nm.length + d.length;
  });

  parts.push(new Uint8Array([0x50, 0x4b, 5, 6, 0, 0, 0, 0, ...u16(files.length), ...u16(files.length), ...u32(cl), ...u32(off), 0, 0]));

}

function sheetXml(rows, widths) {
  const out = rows.map((r, ri) => '<row r="' + (ri + 1) + '">' + r.map((c, ci) => {
    const ref = colL(ci) + (ri + 1);
    if (c === null || c === undefined || c === '') return '';
    if (typeof c === 'string') return '<c r="' + ref + '" t="inlineStr"' + (ri === 0 ? ' s="1"' : '') + '><is><t xml:space="preserve">' + xe(c) + '</t></is></c>';
    if (typeof c === 'number') return '<c r="' + ref + '" s="3"><v>' + c + '</v></c>';
    if (c.f) return '<c r="' + ref + '" s="2"><f>' + xe(c.f) + '</f><v>' + c.v + '</v></c>';
    if (c.n !== undefined) return '<c r="' + ref + '" s="2"><v>' + c.n + '</v></c>';
    if (c.bn !== undefined) return '<c r="' + ref + '" s="4"><v>' + c.bn + '</v></c>';
    if (c.bf) return '<c r="' + ref + '" s="4"><f>' + xe(c.bf) + '</f><v>' + c.v + '</v></c>';
    if (c.b) return '<c r="' + ref + '" t="inlineStr" s="1"><is><t>' + xe(c.b) + '</t></is></c>';
    return '';
  }).join('') + '</row>').join('');
  const cols = '<cols>' + widths.map((w, i) => '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + w + '" customWidth="1"/>').join('') + '</cols>';

}

function spLastWeek(){const now=new Date(); const mon=new Date(now.getFullYear(),now.getMonth(),now.getDate()-((now.getDay()+6)%7)).getTime(); const a=mon-7*864e5,b=mon,pa=mon-14*864e5; const ok=SPS.orders.filter(o=>o.status==='onaylandi'||o.status==='teslim'); const cur=ok.filter(o=>{const t=new Date(o.created_at).getTime(); return t>=a&&t<b;}); const prev=ok.filter(o=>{const t=new Date(o.created_at).getTime(); return t>=pa&&t<a;}); if(!cur.length) return null; const sum=(L)=>L.reduce((s,o)=>s+nz(o.total),0); const c=sum(cur),p=sum(prev);

  let kar=0; cur.forEach(o=>o.lines.forEach(l=>{const pr=lineMatch(l.name); if(pr&&nz(pr.cost)>0) kar+=(nz(l.price)-nz(pr.cost))*nz(l.qty);})); return {c,p,n:cur.length,topC,topCv:by[topC],topP,fresh,kar,key:new Date(a).toISOString().slice(0,10)};}

async function spShare(bytes,name,title){try{const f=new File([bytes],name,{type:'application/pdf'}); if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title}); return;}}catch(e){if(e&&e.name==='AbortError') return;} spDl(bytes,name); spToast('PDF hazır.');}
/* PDF iskeleti: üst bant, sayfa altı, sayfa taşması */
function spPdfKit(title,sub,info){const d=KP.pdf(),W=d.W,H=d.H,M=40,G='#1f6f55',MUT='#5b6b63'; const k={d,W,H,M,G,MUT,y:0,n:0};
  k.foot=()=>{d.line(M,H-40,W-M,H-40,'#dfe7e2',0.6); d.text(M,H-26,KP.fit(SUP.name+((SPS.prof&&SPS.prof.phone)?' · '+SPS.prof.phone:''),W-2*M-80,8,false),{size:8,color:MUT}); d.text(W-M,H-26,'Sayfa '+k.n,{size:8,align:'r',color:MUT});};
  k.page=(first)=>{ if(k.n) k.foot(); d.page(); k.n++; if(first){d.rect(0,0,W,86,G); d.text(M,36,'KaisPilot Toptancı',{size:10,bold:true,color:'#cfeadd'}); d.text(M,64,KP.fit(title,W-2*M-260,20,true),{size:20,bold:true,color:'#ffffff'}); d.text(W-M,64,sub,{size:10,align:'r',color:'#ffffff',bold:true}); k.y=104; if(info){d.text(M,k.y+8,KP.fit(info,W-2*M,9,false),{size:9,color:MUT}); k.y+=28;} } else {d.rect(0,0,W,30,G); d.text(M,20,KP.fit(title,W-2*M-120,9.5,true),{size:9.5,bold:true,color:'#ffffff'}); d.text(W-M,20,sub,{size:9,align:'r',color:'#ffffff'}); k.y=48;}};
  k.need=(h)=>{ if(k.y+h>H-54) k.page(false); };
  k.end=()=>{k.foot(); return d.build();}; k.page(true); return k;}
/* fotoğrafı küçük bir JPEG'e çevir */
async function spImgJpeg(url){const r=await fetch(url); if(!r.ok) throw new Error('foto'); const bl=await r.blob(); const u=URL.createObjectURL(bl); try{const im=await new Promise((ok,no)=>{const i=new Image(); i.onload=()=>ok(i); i.onerror=()=>no(new Error('foto')); i.src=u;}); const M=260,k=Math.min(1,M/Math.max(im.width,im.height)); const w=Math.max(1,Math.round(im.width*k)),h=Math.max(1,Math.round(im.height*k)); const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,w,h); x.drawImage(im,0,0,w,h); const b=atob(c.toDataURL('image/jpeg',0.78).split(',')[1]); return {bin:b,w,h};} finally{URL.revokeObjectURL(u);}}

const spPr=(v)=>KP.n(v,v%1?2:0).replace(/,00$/,'');
async function spCatBuild(s){const L=spCatProds(s); if(!L.length) throw new Error('Katalog için ürün seçilmedi.'); const f=SPS.prof||{};
  const info=[f.phone,[f.address,f.district,f.city].filter(Boolean).join(' '),f.min_order>0?'En az sipariş '+KP.tl(f.min_order):'',f.delivery_fee>0?'Teslimat '+KP.tl(f.delivery_fee)+(f.free_over>0?' ('+KP.tl(f.free_over)+' üzeri ücretsiz)':''):''].filter(Boolean).join('  ·  ');
  const k=spPdfKit(SUP.name,(s.bid?'Özel liste · '+KP.fit(bizName(s.bid),150,10,true):'Ürün kataloğu')+' · '+KP.fd(Date.now())+' '+new Date().getFullYear(),info), d=k.d, M=k.M, W=k.W, G=k.G, MUT=k.MUT;
  const im={}; if(s.photo){const todo=L.filter(p=>p.photos&&p.photos[0]); for(let i=0;i<todo.length;i+=4) await Promise.all(todo.slice(i,i+4).map(async p=>{try{const r=await spImgJpeg(p.photos[0]); im[p.id]=Object.assign({k:d.image(r.bin,r.w,r.h,3)},{w:r.w,h:r.h});}catch(e){}}));}
  const gap=12,cw=(W-2*M-gap)/2,ch=108; let col=0,cat=null;
  L.forEach(p=>{const c=p.category||'Diğer'; if(c!==cat){ if(col){k.y+=ch+8; col=0;} cat=c; k.need(40+ch); k.y+=6; d.text(M,k.y+12,c,{size:12,bold:true,color:G}); d.line(M,k.y+18,W-M,k.y+18,'#cfdad4',0.8); k.y+=28;}
    if(col===0) k.need(ch+8); const x=M+col*(cw+gap), y=k.y;
    d.rect(x,y,cw,ch,'#f6faf7'); d.rect(x,y,3,ch,G);
    const bx=x+10,by=y+10,bs=88; if(im[p.id]){const r=im[p.id],sc=Math.min(bs/r.w,bs/r.h),w=r.w*sc,h=r.h*sc; d.img(bx+(bs-w)/2,by+(bs-h)/2,w,h,r.k);} else {d.rect(bx,by,bs,bs,'#e6eee9'); d.text(bx+bs/2,by+bs/2+9,String(p.name||'?').charAt(0).toUpperCase(),{size:28,bold:true,color:'#8fb3a2',align:'c'});}
    const tx=bx+bs+10,tw=cw-(tx-x)-8; const nl=KP.wrap(p.name,tw,10.5,true).slice(0,2); nl.forEach((l,i)=>d.text(tx,y+32+i*12,l,{size:10.5,bold:true}));
    const sub=[p.brand,p.min_qty>1?'en az '+p.min_qty+' '+(p.unit||''):''].filter(Boolean).join(' · '); if(sub) d.text(tx,y+32+nl.length*12+2,KP.fit(sub,tw,8,false),{size:8,color:MUT});
    const promo=unitLeft(p); if(promo){d.rect(x+cw-76,y+6,70,14,'#d98a2b'); d.text(x+cw-41,y+16,'%'+p.promo_pct+' kampanya',{size:7.5,bold:true,color:'#ffffff',align:'c'});} else if(p.stock==='yok'){d.rect(x+cw-76,y+6,70,14,'#9aa7a0'); d.text(x+cw-41,y+16,'Stokta yok',{size:7.5,bold:true,color:'#ffffff',align:'c'});}
    if(s.price){const pr=spKp(p,s); d.text(tx,y+72,KP.tl(pr).replace(' TL','')+' TL',{size:14,bold:true,color:G}); d.text(tx+KP.tw(KP.tl(pr),14,true)+4,y+72,'/ '+(p.unit||'adet'),{size:8.5,color:MUT}); if(promo&&!s.bid) d.text(tx,y+83,'Eski fiyat '+KP.tl(p.price),{size:7.5,color:MUT});
      const tl=s.bid?'':(p.tiers||[]).slice().sort((a,b)=>a.q-b.q).map(t=>t.q+'+ '+(p.unit||'')+': '+KP.tl(Number(p.price)*(1-t.p/100))).join('  ·  '); if(tl) d.text(tx,y+97,KP.fit(tl,tw,7.5,false),{size:7.5,color:MUT});}
    else d.text(tx,y+72,'Birim: '+(p.unit||'adet'),{size:9.5,color:MUT});
    col++; if(col===2){col=0; k.y+=ch+8;}});
  if(col) k.y+=ch+8; k.need(30); d.text(M,k.y+10,'Fiyatlar ve stok durumu değişebilir. Sipariş için bizimle iletişime geçin.'+((SPS.books.iban&&SPS.books.iban.iban)?'   IBAN '+SPS.books.iban.iban.replace(/(.{4})/g,'$1 ').trim():''),{size:8.5,color:MUT});
  return k.end();}

function spCmpList(s){return SPS.prods.filter(p=>p.active!==false&&(!s.cat||(p.category||'Diğer')===s.cat)).sort((a,b)=>String(a.name).localeCompare(String(b.name),'tr'));}
async function spCmpApply(on){spCmpKeep(); const s=SPS.sheet; const ids=Object.keys(s.sel).filter(i=>s.sel[i]); if(!ids.length) return spToast('Önce ürün seç.',1); if(on&&!(s.pct>0&&s.pct<=90)) return spToast('İndirim yüzdesi 1 ile 90 arasında olmalı.',1); if(on&&s.until&&s.until<isoToday()) return spToast('Bitiş tarihi geçmişte olamaz.',1);
  const row=on?{promo_pct:s.pct,promo_until:s.until||null}:{promo_pct:0,promo_until:null}; const r=await sb.from('supplier_products').update(Object.assign({updated_at:new Date().toISOString()},row)).in('id',ids); if(spDb(r)) return spErr(spDb(r));
  SPS.prods.forEach(p=>{if(ids.includes(p.id)) Object.assign(p,row);}); SPS.sheet=null; spRender(true); spToast(on?ids.length+' ürüne %'+s.pct+' kampanya uygulandı.':ids.length+' üründe kampanya kaldırıldı.');}

const spRem=(o,i)=>{const l=o.lines[i],g=((spParts()[o.id]||{}).got||{})[i]||0; return Math.max(0,Math.round(((Number(l.qty)||0)-g)*1000)/1000);};
SPA.partopen=(el)=>{const o=spOf(el.dataset.id); if(!o) return; SPS.sheet={t:'part',id:o.id,close:false}; spRender(true);};
SPA.partcl=()=>{const s=SPS.sheet; s.vals=spPartVals(); s.close=!s.close; spRender(true);};
function spPartVals(){const v={}; document.querySelectorAll('.sp-rw input[data-pi]').forEach(i=>{v[i.dataset.pi]=i.value;}); return v;}
SPA.partgo=async()=>{const s=SPS.sheet,o=spOf(s.id); if(!o) return; const v=spPartVals(); const P=spParts(); const rec=P[o.id]=P[o.id]||{got:{},log:[]}; const rows=[]; let sentAny=0;
  for(let i=0;i<o.lines.length;i++){const rem=spRem(o,i); const raw=String(v[i]==null?'':v[i]).trim(); const q=raw===''?rem:Math.min(rem,nz(raw.replace(',','.'))); if(q>0) rows.push({i,q}); sentAny+=q;}
  if(!(sentAny>0)&&!s.close) return spToast('Giden miktarı yaz.',1);
  for(const r of rows){const l=o.lines[r.i],p=lineMatch(l.name); if(p){try{await spMove(p.id,'cikis',r.q,bizName(o.business_id),'Kısmi teslim');}catch(e){}} rec.got[r.i]=(rec.got[r.i]||0)+r.q;}
  if(rows.length) rec.log.push({at:new Date().toISOString(),rows:rows.map(r=>({name:o.lines[r.i].name,q:r.q,unit:o.lines[r.i].unit}))});
  const left=o.lines.map((l,i)=>({l,i,rem:spRem(o,i)})).filter(x=>x.rem>0); const complete=!left.length||s.close;
  if(complete){ let upd={status:'teslim'}; if(left.length){const short=left.reduce((a,x)=>a+x.rem*(Number(x.l.price)||0),0); const nl=o.lines.map((l,i)=>Object.assign({},l,{qty:rec.got[i]||0})).filter(l=>l.qty>0); const nt=Math.round((o.lines.reduce((a,l,i)=>a+(rec.got[i]||0)*(Number(l.price)||0),0))*100)/100; upd.lines=nl; upd.total=nt; const c=SPS.books.cari.find(x=>x.orderId===o.id&&!x.paid); if(c) c.amt=Math.max(0,Math.round((c.amt-short)*100)/100); rec.closedShort=short; }
    const r=await sb.from('orders').update(upd).eq('id',o.id); if(spDb(r)) return spToast(spDb(r),1); Object.assign(o,upd); o.delivery='teslim_edildi'; try{await sb.from('orders').update({delivery:'teslim_edildi',delivery_at:new Date().toISOString(),delivery_by:'Toptancı'}).eq('id',o.id);}catch(x){} spNotify(o,'teslim_edildi'); rec.done=true; spSaveBooks(); SPS.sheet=null; spRender(true); return spToast(left.length?'Sipariş kalan olmadan kapatıldı, tutar düzeltildi.':'Tüm kalemler teslim edildi.');}
  spSaveBooks(); spNotify(o,'kismi'); SPS.sheet={t:'wam',id:o.id,k:'gecik',txt:spWaMsg(o,'gecik'),mark:false}; spRender(true); spToast('Kısmi teslim kaydedildi. Kalan '+left.length+' kalem.');};
const _otes17=SPA.otes; SPA.otes=function(el,e){const o=spOf(el.dataset.id); if(o&&spParts()[o.id]&&!spParts()[o.id].done){return SPA.partopen(el);} return _otes17.call(this,el,e);};

const RET_W=[['hasar','Bozuk / hasarlı'],['yanlis','Yanlış ürün'],['skt','SKT sorunu'],['vazgec','Müşteri vazgeçti'],['diger','Diğer']];
const spRetQ=(o,i)=>{const r=spRets().filter(x=>x.oid===o.id).reduce((a,x)=>a+((x.rows.find(y=>y.i===i)||{}).q||0),0); return Math.max(0,Math.round(((Number(o.lines[i].qty)||0)-r)*1000)/1000);};
SPA.retopen=(el)=>{const o=spOf(el.dataset.id); if(!o) return; SPS.sheet={t:'ret',id:o.id,why:'hasar',restock:false}; spRender(true);};
SPA.retwhy=(el)=>{const s=SPS.sheet; s.vals=spPartVals(); s.why=el.dataset.v; s.restock=s.why!=='hasar'&&s.why!=='skt'; spRender(true);};
SPA.retrs=()=>{const s=SPS.sheet; s.vals=spPartVals(); s.restock=!s.restock; spRender(true);};
SPA.retgo=async()=>{const s=SPS.sheet,o=spOf(s.id); if(!o) return; const v=spPartVals(); const rows=[]; o.lines.forEach((l,i)=>{const q=Math.min(spRetQ(o,i),nz(String(v[i]||'').replace(',','.'))); if(q>0) rows.push({i,name:l.name,unit:l.unit,q,price:Number(l.price)||0});}); if(!rows.length) return spToast('İade edilen miktarı yaz.',1);
  const total=Math.round(rows.reduce((a,r)=>a+r.q*r.price,0)*100)/100; const biz=bizName(o.business_id);
  if(s.restock) for(const r of rows){const p=lineMatch(r.name); if(p){try{await spMove(p.id,'giris',r.q,biz,'İade');}catch(e){}}}
  let rest=total; const c=SPS.books.cari.find(x=>x.orderId===o.id&&!x.paid&&x.kind==='alacak'); if(c){const cut=Math.min(c.amt,rest); c.amt=Math.round((c.amt-cut)*100)/100; rest=Math.round((rest-cut)*100)/100; c.note=(c.note||'')+' (iade '+KP.tl(cut)+' düşüldü)'; if(c.amt<=0) c.paid=true;}
  if(rest>0) SPS.books.ledger.push({id:bid(),type:'gider',date:isoToday(),desc:'Satış iadesi · '+biz,party:biz,cat:'Satış iadesi',amt:rest,vat:10,doc:'var'});
  spRets().push({id:bid(),oid:o.id,biz,rows:rows.map(r=>({i:r.i,name:r.name,q:r.q,unit:r.unit,price:r.price})),total,why:s.why,restock:!!s.restock,at:new Date().toISOString()}); spSaveBooks(); spNotify(o,'iade'); SPS.sheet=null; spRender(true); spToast('İade kaydedildi: '+KP.tl(total)+(c?' · cari düşüldü':'')+'.');};
const _spRepData17=spRepData; spRepData=function(kind){const d=_spRepData17(kind); const R=spRets(); if(R.length) d.orders.forEach((x,i)=>{const o=SPS.orders[i]; if(!o) return; const t=R.filter(r=>r.oid===o.id).reduce((a,r)=>a+r.total,0); if(t>0) x.total=Math.max(0,Number(x.total)-t);}); return d;};

function spSevStops(day){const t0=new Date(); t0.setHours(0,0,0,0); const T=t0.getTime(); const lim=day==='bugun'?T+864e5:day==='yarin'?T+2*864e5:day==='hafta'?T+8*864e5:Infinity; const from=day==='yarin'?T+864e5:-Infinity;
  const L=SPS.orders.filter(o=>o.status==='onaylandi').filter(o=>{const d=spDue(o); return d<lim&&d>=from||(day==='bugun'&&d<T+864e5);}); const by={}; L.forEach(o=>{(by[o.business_id]=by[o.business_id]||[]).push(o);});
  const stops=Object.keys(by).map(bid=>{const os=by[bid],b=(SPS.bizs||{})[bid]||{}; const agg={}; os.forEach(o=>o.lines.forEach((l,i)=>{const q=spRem(o,i); if(q>0){const k=l.name+'|'+(l.unit||''); (agg[k]=agg[k]||{n:l.name,u:l.unit||'',q:0}).q+=q;}})); const ids=os.map(o=>o.id); const pay=SPS.books.cari.filter(c=>c.kind==='alacak'&&!c.paid&&ids.includes(c.orderId)).reduce((a,c)=>a+c.amt,0); const cn=(SPS.books.cnotes||{})[bid]||{}; const pt=spPt(bid);
    return {bid,name:bizName(bid),addr:[b.address,b.district,b.city].filter(Boolean).join(' '),phone:b.phone||b.tel||'',items:Object.values(agg),total:os.reduce((a,o)=>a+(Number(o.total)||0),0),pay,note:[cn.text,...(cn.tags||[])].filter(Boolean).join(' · '),pt,due:Math.min(...os.map(spDue)),n:os.length};});
  const f=SPS.prof||{}; let cur=f.lat!=null?{a:Number(f.lat),b:Number(f.lng)}:null; const withP=stops.filter(s=>s.pt),rest=stops.filter(s=>!s.pt).sort((a,b)=>a.name.localeCompare(b.name,'tr')); const ord=[]; let km=0;
  while(withP.length){let bi=0,bd=Infinity; if(cur) withP.forEach((s,i)=>{const dd=spHav(cur.a,cur.b,s.pt.c,s.pt.d); if(dd<bd){bd=dd;bi=i;}}); const s=withP.splice(bi,1)[0]; if(cur&&isFinite(bd)) km+=bd*1.3; s.leg=cur?Math.round(bd*1.3*10)/10:null; ord.push(s); cur={a:s.pt.c,b:s.pt.d};}
  if(cur&&f.lat!=null&&ord.length) km+=spHav(cur.a,cur.b,Number(f.lat),Number(f.lng))*1.3; return {stops:ord.concat(rest),km:Math.round(km*10)/10,located:ord.length};}

    let yy=y+36; if(s.addr){d.text(M+36,yy,KP.fit(s.addr,W-2*M-50,8.5,false),{size:8.5,color:k.MUT}); yy+=13;} L.forEach(l=>{d.text(M+36,yy,l,{size:9}); yy+=12;}); if(s.note){d.text(M+36,yy+1,KP.fit('Not: '+s.note,W-2*M-50,8.5,false),{size:8.5,color:k.MUT}); yy+=13;} if(s.pay>0){d.text(M+36,yy+1,'Tahsil edilecek: '+KP.tl(s.pay),{size:9,bold:true,color:'#a05a00'});}

.mc-h{display:flex;gap:11px;align-items:center}.mc-n{flex:1;min-width:0}.mc-n b{display:block;font:650 15px/1.25 system-ui;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mc-n span{display:block;font:500 12.5px system-ui;color:var(--mut);margin-top:2px}

.mc-a{display:flex;gap:4px;border-top:1px solid #eef1ee;padding-top:8px}.mc-a button{background:transparent;color:var(--acc);padding:6px 9px;border-radius:9px;font:600 13px system-ui}.mc-a button:hover{background:#eaf3ee}.mc-a button:last-child{margin-left:auto;color:var(--mut)}

`; document.head.appendChild(st);
const HUE=s=>{let h=0; for(const c of String(s||'x')) h=(h*31+c.charCodeAt(0))%360; return h;};
const SG=[['ozet','Özet'],['defter','Defter'],['cari','Cari'],['rapor','Rapor'],['mus','Müşteri']];
SPS.lq=''; SPS.cf2=''; SPS.mq=''; SPS.mf=''; SPS.ms='ciro';
const seg=()=>`<div class="sp-seg">${SG.map(s=>`<button data-sp="acc" data-v="${s[0]}" class="${SPS.acc===s[0]?'on':''}">${s[1]}</button>`).join('')}</div>`;

const insBox=(title,arr,ok)=>`<div class="mh-ins"><div class="mh-ih">${SPI('spark',18)}${title}</div>${arr.length?arr.map(tip).join(''):`<div class="up-tip">${SPI('check',18)}<span>${esc(ok)}</span></div>`}</div>`;
const ledRow=(e)=>{const g=e.type==='gelir'; return `<button class="mh-r" data-sp="ledit" data-id="${e.id}"><div class="mh-i ${g?'g':'x'}">${g?'↓':'↑'}</div><div class="mh-t"><b>${esc(e.desc||e.cat||'Kayıt')}</b><span>${new Date(e.date).toLocaleDateString('tr-TR',{day:'numeric',month:'short'})}${e.party?' · '+esc(e.party):''}${e.cat&&!g?' · '+esc(e.cat):''}</span>${(e.vat!=null||e.doc==='eksik')?`<div class="up-bg">${e.vat!=null?`<span class="sp-b mut">KDV %${e.vat}</span>`:''}${e.doc==='eksik'?'<span class="sp-b warn">Belge eksik</span>':''}</div>`:''}</div><div class="mh-a ${g?'g':'x'}">${g?'+':'−'}${tl0(e.amt)}</div></button>`;};
const addBtns=`<div class="mh-ac"><button class="pri" data-sp="led" data-v="gelir">${SPI('plus',16)} Gelir</button><button class="sec" data-sp="led" data-v="gider">${SPI('plus',16)} Gider</button></div>`;

function mOzet(){const s=spStats(SPS.mon), pv=spStats(monShift(SPS.mon,-1)); const cr=SPS.books.cari.filter(c=>!c.paid); const al=cr.filter(c=>c.kind==='alacak'), bo=cr.filter(c=>c.kind==='borc');
  const due=cr.filter(c=>c.due&&dLeft(c.due)<=7).sort((a,b)=>a.due>b.due?1:-1); const od=spOverdue();
  const missVat=s.L.filter(e=>e.type==='gider'&&e.doc==='eksik').reduce((a,e)=>a+vatOf(Number(e.amt)||0,e.vat),0);
  const I=[]; if(od.length) I.push(['bad','alert',od.length+' alacağının vadesi geçti ('+tl0(od.reduce((a,c)=>a+nz(c.amt),0))+'). Nazik bir hatırlatma gönderebilirsin.','Cari\'ye git','mgo','cari:od']);
  if(s.miss) I.push(['warn','doc',s.miss+' giderin belgesi eksik. İndirilebilir KDV yaklaşık '+tl0(missVat)+' kaybolabilir.','Belgeleri gör','mgo','defter:Eksik belge']);
  if(s.net<0) I.push(['bad','alert','Bu ay giderler geliri aştı (net '+tl0(s.net)+'). En büyük gider kalemi: '+((s.cats[0]||['yok'])[0])+'.','Raporu aç','mgo','rapor']);
  else if(pv.x>0&&s.x>pv.x*1.2&&s.x>0) I.push(['warn','tag','Giderlerin geçen aya göre %'+Math.round((s.x-pv.x)/pv.x*100)+' arttı. En büyük kalem: '+((s.cats[0]||['yok'])[0])+'.','Raporu aç','mgo','rapor']);
  const bd=bo.filter(c=>c.due&&dLeft(c.due)>=0&&dLeft(c.due)<=7)[0]; if(bd) I.push(['warn','clock',bd.who+' borcu '+(dLeft(bd.due)===0?'bugün':dLeft(bd.due)+' gün içinde')+' ödenmeli ('+tl0(bd.amt)+').','Cari\'ye git','mgo','cari']);
  if(s.kdv>0) I.push(['','tag','Bu ay tahmini KDV ödemen '+tl0(s.kdv)+'. Tahmindir, muhasebecin teyit eder.']);
  const last=s.L.slice().sort((a,b)=>a.date<b.date?1:-1).slice(0,5);
  return seg()+monBar(addBtns)+`<div class="mh-k"><div class="g"><span>Gelir</span><b>${tl0(s.g)}</b>${dlt(s.g,pv.g)}</div><div class="x"><span>Gider</span><b>${tl0(s.x)}</b>${dlt(s.x,pv.x,1)}</div><div class="n ${s.net<0?'neg':''}"><span>Net</span><b>${tl0(s.net)}</b>${dlt(s.net,pv.net)}</div><div class="${s.kdv>0?'warn':''}"><span>${s.kdv>0?'Tahmini KDV':'Devreden KDV'}</span><b>${tl0(Math.abs(s.kdv))}</b></div></div>
  ${insBox('Kais\'in önerileri',I.slice(0,3),'Her şey yolunda. Bu ay için dikkat gerektiren bir konu yok.')}
  <div class="mh-g"><div class="mh-c"><div class="mh-ch"><b>Alacak ve borç</b><button class="mh-more" data-sp="mgo" data-v="cari">Cari</button></div><div class="mh-two"><div><span>Alacağın</span><b>${tl0(al.reduce((a,c)=>a+nz(c.amt),0))}</b></div><div><span>Borcun</span><b>${tl0(bo.reduce((a,c)=>a+nz(c.amt),0))}</b></div></div>${due.length?due.slice(0,4).map(c=>`<div class="mh-row"><span>${esc(c.who)} <em class="sp-b ${c.kind==='alacak'?'ok':'warn'}">${c.kind==='alacak'?'alacak':'borç'}</em></span><span class="${dLeft(c.due)<0?'neg':''}">${dLeft(c.due)<0?Math.abs(dLeft(c.due))+' gün gecikti':dLeft(c.due)===0?'bugün':dLeft(c.due)+' gün'}</span></div>`).join(''):'<p class="sp-d" style="margin:0">Yakın vadeli kayıt yok.</p>'}</div>
  <div class="mh-c"><div class="mh-ch"><b>KDV tahmini</b><span class="sp-b ${s.kdv>0?'warn':'ok'}">${s.kdv>0?'Ödenecek':'Devreden'}</span></div><div><div class="mh-row"><span>Hesaplanan KDV (satış)</span><b>${tl0(s.gv)}</b></div><div class="mh-row"><span>İndirilecek KDV (belgeli gider)</span><b>${tl0(s.xv)}</b></div><div class="mh-row"><b>${s.kdv>0?'Tahmini ödeme':'Tahmini devreden'}</b><b>${tl0(Math.abs(s.kdv))}</b></div></div><p class="sp-d" style="margin:0">${s.miss?s.miss+' giderin belgesi eksik. Eksik belgenin KDV\'si indirilmez. ':''}Tahmindir, muhasebecin teyit eder.</p></div>
  <div class="mh-c"><div class="mh-ch"><b>Gider dağılımı</b><button class="mh-more" data-sp="mgo" data-v="rapor">Rapor</button></div>${spBars(s.cats,s.x,'x')}</div>
  <div class="mh-c"><div class="mh-ch"><b>Son kayıtlar</b><button class="mh-more" data-sp="mgo" data-v="defter">Tümünü gör</button></div>${last.length?`<div style="display:flex;flex-direction:column;gap:8px">${last.map(ledRow).join('')}</div>`:'<p class="sp-d" style="margin:0">Bu ay kayıt yok.</p>'}</div></div>`;}

function mDefList(){const s=spStats(SPS.mon); const f=SPS.led; const q=nrm(SPS.lq);
  const L=s.L.filter(e=>(f==='Tümü'||(f==='Gelir'&&e.type==='gelir')||(f==='Gider'&&e.type==='gider')||(f==='Eksik belge'&&e.doc==='eksik'))&&(!q||nrm((e.desc||'')+' '+(e.party||'')+' '+(e.cat||'')).includes(q))).sort((a,b)=>a.date<b.date?1:-1);

function mDefter(){const s=spStats(SPS.mon); const f=SPS.led; const cnt={Tümü:s.L.length,Gelir:s.L.filter(e=>e.type==='gelir').length,Gider:s.L.filter(e=>e.type==='gider').length,'Eksik belge':s.miss};

  `<div class="mh-k" style="grid-template-columns:repeat(3,1fr)"><div class="g"><span>Gelir</span><b>${tl0(s.g)}</b></div><div class="x"><span>Gider</span><b>${tl0(s.x)}</b></div><div class="n ${s.net<0?'neg':''}"><span>Net</span><b>${tl0(s.net)}</b></div></div>
  <div class="up-top"><label class="sp-s">${SPI('search',18)}<input id="ml-q" placeholder="Kayıtlarda ara" value="${esc(SPS.lq)}" autocomplete="off"></label></div>
  <div class="up-row">${['Tümü','Gelir','Gider','Eksik belge'].filter(c=>c==='Tümü'||cnt[c]>0||f===c).map(c=>`<button class="up-k ${c==='Eksik belge'?'warn':c==='Gelir'?'ok':c==='Gider'?'bad':''}${f===c?' on':''}" data-sp="lf" data-v="${c}"><i></i>${c} <b>${cnt[c]}</b></button>`).join('')}</div>

function mCari(){const C=SPS.books.cari; const open=C.filter(c=>!c.paid).sort((a,b)=>(a.due||'9')>(b.due||'9')?1:-1); const done=C.filter(c=>c.paid).slice(-6).reverse();
  const al=open.filter(c=>c.kind==='alacak'), bo=open.filter(c=>c.kind==='borc'), od=spOverdue(); const sa=al.reduce((a,c)=>a+nz(c.amt),0), sbr=bo.reduce((a,c)=>a+nz(c.amt),0), so=od.reduce((a,c)=>a+nz(c.amt),0);
  const f=SPS.cf2; const isOd=c=>!c.paid&&c.due&&dLeft(c.due)<0; const shown=open.filter(c=>!f||(f==='alacak'&&c.kind==='alacak')||(f==='borc'&&c.kind==='borc')||(f==='od'&&isOd(c)));
  const card=(c)=>{const o=isOd(c); return `<div class="mh-c mh-ce${o?' od':''}"><div class="mh-ch"><b>${esc(c.who)}</b><span class="big ${c.kind==='alacak'?'g':'x'}">${tl0(c.amt)}</span></div><div class="up-bg"><span class="sp-b ${c.kind==='alacak'?'ok':'warn'}">${c.kind==='alacak'?'Alacak':'Borç'}</span>${c.due?`<span class="sp-b ${o?'bad':'mut'}">${o?Math.abs(dLeft(c.due))+' gün gecikti':'Vade '+new Date(c.due).toLocaleDateString('tr-TR')}</span>`:''}${c.paid?'<span class="sp-b ok">Kapandı</span>':''}${c.rem?`<span class="sp-b mut">${Math.floor((Date.now()-new Date(c.rem))/864e5)===0?'bugün':Math.floor((Date.now()-new Date(c.rem))/864e5)+' gün önce'} hatırlatıldı</span>`:''}</div>${c.note?`<p class="sp-d" style="margin:0">${esc(c.note)}</p>`:''}${c.paid?'':`<div class="acts"><button data-sp="cclose" data-id="${c.id}">${c.kind==='alacak'?'Tahsil edildi':'Ödendi'}</button>${o&&c.kind==='alacak'?`<button data-sp="crem" data-id="${c.id}">Hatırlat</button>`:''}<button data-sp="cedit" data-id="${c.id}">Düzenle</button></div>`}</div>`;};
  const ch=[['','Hepsi',open.length,''],['alacak','Alacak',al.length,'ok'],['borc','Borç',bo.length,'warn'],['od','Vadesi geçen',od.length,'bad']].filter(x=>x[0]===''||x[2]>0||f===x[0]);
  return seg()+`<div class="mh-top"><div></div><div class="mh-ac"><button class="pri" data-sp="cari" data-v="alacak">${SPI('plus',16)} Alacak</button><button class="sec" data-sp="cari" data-v="borc">${SPI('plus',16)} Borç</button></div></div>

  ${od.length?`<div class="up-tip bad">${SPI('alert',18)}<span>${od.length} alacağın vadesi geçti (${tl0(so)}). Tek dokunuşla nazik bir hatırlatma hazırlanır, göndermeden önce WhatsApp'ta düzenleyebilirsin.</span><button data-sp="cfl" data-v="od">Gecikenleri gör</button></div>`:''}

  ${(function(){try{return spRcCard();}catch(e){return '';}})().replace('class="sp-card"','class="mh-c" style="margin-top:14px"')}
  ${done.length?`<h2 class="sp-h" style="margin-top:16px">Kapananlar</h2><div class="mh-list">${done.map(card).join('')}</div>`:''}`;}

function mRapor(){const s=spStats(SPS.mon); const M=[]; for(let i=-5;i<=0;i++){const m=monShift(SPS.mon,i); const t=spStats(m); M.push({m,g:t.g,x:t.x});} const mx=Math.max(1,...M.map(x=>Math.max(x.g,x.x)));

  return seg()+monBar(`<div class="mh-ac"><button class="sec" data-sp="rppdf" data-v="w">${SPI('doc',16)} Geçen hafta PDF</button><button class="sec" data-sp="rppdf" data-v="m">${SPI('doc',16)} Bu ay PDF</button><button class="pri" data-sp="xlopen">${SPI('doc',16)} Excel'e aktar</button></div>`)+

  <div class="mh-c"><div class="mh-ch"><b>En çok satış yaptığın müşteriler</b></div>${spBars(s.who,s.g,'g')}</div><div class="mh-c"><div class="mh-ch"><b>Gider kategorileri</b></div>${spBars(s.cats,s.x,'x')}</div>
  <div class="mh-c full"><div class="mh-ch"><b>Dışa aktar</b></div><div class="mh-ac"><button class="sec" data-sp="csv">${SPI('doc',16)} ${esc(monL(SPS.mon))} (CSV)</button><button class="sec" data-sp="csvall">${SPI('doc',16)} Tüm kayıtlar (CSV)</button></div></div></div>`;}

const cfav=()=>(SPS.books.cfav=SPS.books.cfav||{});
const sameN=(a,b)=>{a=nrm(a);b=nrm(b);return !!a&&!!b&&(a.includes(b)||b.includes(a));};
function mCustData(){const by={}; SPS.orders.filter(o=>o.status!=='iptal').forEach(o=>{(by[o.business_id]=by[o.business_id]||[]).push(o);}); const now=Date.now(); const cari=SPS.books.cari.filter(c=>!c.paid&&c.kind==='alacak');
  const R=Object.keys(by).map(id=>{const L=by[id].slice().sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)); const tot=L.reduce((a,o)=>a+nz(o.total),0); const last=new Date(L[L.length-1].created_at), first=new Date(L[0].created_at); const since=Math.floor((now-last)/864e5); const gap=L.length>1?Math.round((last-first)/864e5/(L.length-1)):null; const lost=since>30||!!(gap&&since>gap*1.6&&since>7); const name=bizName(id); const ac=cari.filter(c=>cariBid(c)===id); const od=ac.filter(c=>c.due&&dLeft(c.due)<0); const cn=(SPS.books.cnotes||{})[id]||{};
    return {id,name,n:L.length,tot,since,gap,lost,avg:tot/L.length,isNew:Math.floor((now-first)/864e5)<=14,ac,acT:ac.reduce((a,c)=>a+nz(c.amt),0),od,odT:od.reduce((a,c)=>a+nz(c.amt),0),disc:discFor(id),tags:cn.tags||[],fav:!!cfav()[id]};});
  return R;}
function mCustFiltered(R){const q=nrm(SPS.mq), f=SPS.mf; let L=R.filter(r=>(!q||nrm(r.name).includes(q))&&(!f||(f==='fav'&&r.fav)||(f==='lost'&&r.lost)||(f==='od'&&r.od.length)||(f==='new'&&r.isNew)||(f==='disc'&&r.disc>0)));
  const so=SPS.ms; const cmp={ciro:(a,b)=>b.tot-a.tot,sip:(a,b)=>b.n-a.n,son:(a,b)=>a.since-b.since,ad:(a,b)=>a.name.localeCompare(b.name,'tr'),sessiz:(a,b)=>(b.lost-a.lost)||(b.since-a.since),sepet:(a,b)=>b.avg-a.avg}[so]||((a,b)=>b.tot-a.tot);
