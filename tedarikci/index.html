<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KaisPilot Tedarik</title>
<meta name="theme-color" content="#164169">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--ink:#1d2a24;--mut:#6b776f;--line:#dfe5e0;--bg:#f6f7f5;--acc:#1f6f55;--bad:#b3392f}
*{box-sizing:border-box}body{margin:0;font:16px/1.45 system-ui,sans-serif;color:var(--ink);background:var(--bg)}
main{max-width:560px;margin:0 auto;padding:16px}h1{font-size:22px;margin:8px 0}h2{font-size:17px;margin:0 0 8px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
button{padding:11px 14px;border:0;border-radius:8px;background:var(--acc);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button.s{background:#e8eee9;color:var(--ink)}button.sm{padding:7px 10px;font-size:14px}button:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.m{color:var(--mut);font-size:14px}.err{color:var(--bad);font-size:14px;min-height:20px}.ok{color:var(--acc)}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;background:#e8eee9}.ln{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line);gap:8px}

/* KaisPilot giriş dili: tedarikçi girişi */
body.lg{background:linear-gradient(180deg,#1F5182 0,#1F5182 150px,#A9C0D8 260px,#E6EDF5 400px,#F2F6FB 560px) no-repeat,#F2F6FB;font-family:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;color:#12213B;-webkit-font-smoothing:antialiased}
body.lg main{max-width:none;padding:0}
.th{position:relative;overflow:hidden;color:#fff;background:radial-gradient(120% 90% at 85% 10%,rgba(91,227,224,.16),transparent 55%),linear-gradient(160deg,#123A63 0,#1B4770 60%,#1F5182 100%);padding:max(20px,env(safe-area-inset-top)) 22px 46px}
.th-in{max-width:520px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px}
.th-brand{display:flex;align-items:center;gap:9px;font:700 19px 'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;letter-spacing:-.2px}
.th h1{margin:16px 0 0;font:700 27px/1.1 'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;letter-spacing:-.4px;color:#fff}
.th p{margin:6px 0 0;font-size:15px;color:#DCE8F5}
.th-ic{flex:none;width:76px;height:76px;border-radius:20px;display:grid;place-items:center;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);box-shadow:0 8px 24px rgba(5,25,50,.25),inset 0 1px 0 rgba(255,255,255,.18);color:#fff}
.tc{position:relative;max-width:480px;margin:-26px 16px 0;background:#fff;border:1px solid #E1E8F1;border-radius:24px;box-shadow:0 10px 30px rgba(9,40,80,.12);padding:22px 20px 20px}
@media(min-width:520px){.tc{margin:-26px auto 0}}
.tc h2{margin:0;font:700 26px/1.1 'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;letter-spacing:-.4px;color:#12213B}
.tc .sub{margin:4px 0 16px;font-size:14.5px;color:#3B4A63}
.tf{display:flex;flex-direction:column;gap:10px}
.tf .f{display:flex;flex-direction:column;gap:5px}
.tf .f>label{margin:0;font-size:14px;font-weight:600;color:#12213B}
.ti{display:flex;align-items:center;gap:12px;min-height:54px;padding:0 14px;border:1px solid #D3DCE8;border-radius:14px;background:#fff;color:#66738A}
.ti:focus-within{border-color:#0D56A6;box-shadow:0 0 0 3px rgba(13,86,166,.15)}
.ti input{flex:1;min-width:0;border:0;outline:0;padding:12px 0;background:transparent;font:16px 'IBM Plex Sans','Segoe UI',system-ui,sans-serif;color:#12213B}
.ti input::placeholder{color:#8895A9}
.ti .eye{flex:none;background:transparent;color:#66738A;padding:8px;margin:-8px -6px -8px 0;min-width:40px;min-height:40px;display:grid;place-items:center;border-radius:10px}
body.lg .err{margin:0;font-size:14px;min-height:0}body.lg .err:empty{display:none}body.lg .err.ok{color:#1F7753}
.tb{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:54px;border-radius:14px;font:600 17px 'IBM Plex Sans','Segoe UI',system-ui,sans-serif}
.tb.p{margin-top:4px;background:linear-gradient(180deg,#0F5AAE,#093F7A);color:#fff;box-shadow:0 4px 10px rgba(9,63,122,.2)}
.tb.o{background:#fff;color:#0D56A6;border:1px solid #0D56A6;min-height:50px;font-size:16px}
.tb.o span{color:#12213B}
.tb:active{transform:translateY(1px)}
.tn{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:11px 12px;border-radius:12px;background:#EEF4FB;color:#3B4A63;font-size:13.5px;line-height:1.45}
.tn svg{flex:none;color:#0D56A6;margin-top:1px}
.tfoot{margin:14px 0 calc(18px + env(safe-area-inset-bottom));text-align:center;font-size:12.5px;color:#8895A9}
body:not(.lg) .tfoot{margin-top:4px}
/* görseldeki gibi: üst band birebir */
body.lg .th{position:relative;padding:0;height:auto;aspect-ratio:1065/322;background:#0B3D67 url(/tedarikci/ted-hero.jpg) top center/100% auto no-repeat}
body.lg .th-in{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
body.lg{background:linear-gradient(180deg,#1D507D 0,#1D507D calc(30vw),#9DB5CF calc(30vw + 170px),#E6EDF5 calc(30vw + 330px),#F2F6FB calc(30vw + 520px)) no-repeat,#F2F6FB!important}
body.lg .tc{margin:0 7%;max-width:none}
@media(min-width:620px){body.lg .th{aspect-ratio:auto;height:190px;background:#0F4472}body.lg .th::after{content:"";position:absolute;inset:0;background:url(/tedarikci/ted-hero.jpg) center/auto 100% no-repeat;-webkit-mask-image:linear-gradient(90deg,transparent calc(50% - 330px),#000 calc(50% - 250px),#000 calc(50% + 250px),transparent calc(50% + 330px));mask-image:linear-gradient(90deg,transparent calc(50% - 330px),#000 calc(50% - 250px),#000 calc(50% + 250px),transparent calc(50% + 330px))}body.lg .tc{max-width:480px;margin:0 auto}html,body.lg{background:linear-gradient(180deg,#0F4472 0,#1D507D 190px,#9DB5CF 330px,#E6EDF5 520px,#F2F6FB 700px) no-repeat,#F2F6FB!important}}
.tor{display:flex;align-items:center;gap:14px;color:#66738A;font-size:13.5px;margin:0 6px}
.tor::before,.tor::after{content:"";flex:1;height:1px;background:#D5DEEA}
.tn{background:#E4EDF8}
.tback{margin:14px 0 0;text-align:center;font-size:13.5px;color:#66738A}.tback a{color:#0D56A6;font-weight:600;text-decoration:none;display:inline-block;padding:6px 2px}
@media(max-width:619px){
 body.lg{display:flex;flex-direction:column;min-height:100vh;min-height:100svh;background:linear-gradient(180deg,#0B3D67 0,#164A77 20%,#1D507D 27%,#9DB5CF 46%,#E6EDF5 64%,#F2F6FB 100%)!important}
 body.lg main{flex:1 0 auto;display:flex;flex-direction:column}
 body.lg .th{flex:1 0 auto;aspect-ratio:auto;min-height:clamp(150px,40vw,180px);max-height:260px;background:transparent}
 body.lg .th::after{content:"";position:absolute;left:-4%;right:-4%;top:54%;transform:translateY(-50%);aspect-ratio:1065/322;background:url(/tedarikci/ted-hero.jpg) center/100% 100% no-repeat;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 6%,#000 96%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 6%,#000 96%,transparent 100%)}
 body.lg .tc{flex:none}
 body.lg .tfoot{flex:none;margin:12px 0 calc(16px + env(safe-area-inset-bottom))}
}
</style></head><body><main id="app"><p class="m">Yükleniyor…</p></main><p class="tfoot">KaisPilot Tedarik · v5</p>
<script>
window.addEventListener('error',(e)=>{const d=document.createElement('div');d.style.cssText='position:fixed;top:0;left:0;right:0;background:#b3392f;color:#fff;padding:10px;font:14px system-ui;z-index:9';d.textContent='Hata: '+e.message+' ('+(e.lineno||'')+')';document.body.appendChild(d);});
window.addEventListener('unhandledrejection',(e)=>{const d=document.createElement('div');d.style.cssText='position:fixed;top:0;left:0;right:0;background:#b3392f;color:#fff;padding:10px;font:14px system-ui;z-index:9';d.textContent='Hata: '+((e.reason&&e.reason.message)||e.reason);document.body.appendChild(d);});
const SB_URL='https://bbcsbkgbwzciyfymvpxh.supabase.co';
const SB_KEY='sb_publishable_Pc2JtwezlCiezDW4P4IKxw_gXFXUjnA';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=(s)=>document.querySelector(s); const app=$('#app');
const esc=(s)=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tl=(n)=>Number(n).toLocaleString('tr-TR',{maximumFractionDigits:2})+' ₺';
let ME=null, MODE=null, BIZ=null, SUP=null, msg='';
const say=(t,ok)=>{const e=$('#msg'); if(e){e.textContent=t||''; e.className='err'+(ok?' ok':'');}};
async function boot(){
  document.body.classList.remove('lg');
  const {data:{session}}=await sb.auth.getSession(); ME=session&&session.user;
  if(!ME) return loginView();
  await sb.rpc('claim_supplier');
  const b=await sb.from('businesses').select('*').eq('owner_id',ME.id).limit(1);
  if(b.data&&b.data[0]){BIZ=b.data[0];MODE='patron';return patronView();}
  const s=await sb.from('suppliers').select('*').eq('user_id',ME.id).limit(1);
  if(s.data&&s.data[0]){SUP=s.data[0];MODE='sup';return supView();}
  return setupView();
}
function head(t,role){return `<div class="row"><div><h1>${esc(t)}</h1>${role?`<span class="pill">${esc(role)}</span>`:''}</div><button class="s sm" id="out">Çıkış</button></div>`}
function bindOut(){const o=$('#out'); if(o) o.onclick=async()=>{await sb.auth.signOut();boot();};}
function loginView(){
  document.body.classList.add('lg');
  const sv=(b,n)=>`<svg width="${n||20}" height="${n||20}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${b}</svg>`;
  const mark=`<svg width="30" height="30" viewBox="0 0 40 40" fill="none" stroke="#fff" stroke-width="2.6" aria-hidden="true"><circle cx="20" cy="20" r="11"/><circle cx="20" cy="20" r="4.4" fill="#fff" stroke="none"/>${[0,45,90,135,180,225,270,315].map(a=>`<circle cx="${(20+16.5*Math.cos(a*Math.PI/180)).toFixed(1)}" cy="${(20+16.5*Math.sin(a*Math.PI/180)).toFixed(1)}" r="2.3" fill="#fff" stroke="none"/>`).join('')}</svg>`;
  app.innerHTML=`<header class="th"><div class="th-in"><div><div class="th-brand">${mark}<span>KaisPilot</span></div><h1>KaisPilot Tedarik</h1><p>Tedarikçi hesabınıza giriş yapın.</p></div>
   <div class="th-ic">${sv('<path d="M2.5 7h11v9h-11z"/><path d="M13.5 10h4l3 3.2V16h-7"/><circle cx="6.5" cy="17.2" r="1.7"/><circle cx="16.5" cy="17.2" r="1.7"/><path d="M5 7V4.5h6V7M8 4.5V7"/>',40)}</div></div></header>
  <section class="tc"><h2>Giriş yap</h2><p class="sub">Tedarikçi hesabınıza devam edin.</p>
  <form class="tf" id="tfm" novalidate>
   <div class="f"><label for="em">E-posta</label><div class="ti">${sv('<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M4 7.5l8 6 8-6"/>')}<input id="em" type="email" autocomplete="email" inputmode="email" autocapitalize="none" placeholder="e-posta@firma.com"></div></div>
   <div class="f"><label for="pw">Şifre</label><div class="ti">${sv('<rect x="5" y="10.5" width="14" height="10" rx="3"/><path d="M8 10.5V8a4 4 0 018 0v2.5"/>')}<input id="pw" type="password" autocomplete="current-password" placeholder="En az 8 karakter"><button type="button" class="eye" id="eye" aria-label="Şifreyi göster veya gizle">${sv('<path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>')}</button></div></div>
   <p class="err" id="msg" role="alert"></p>
   <button type="button" class="tb p" id="in">Giriş yap ${sv('<path d="M4 12h15M13 6l6 6-6 6"/>',22)}</button>
   <div class="tor"><span>veya</span></div>
   <button type="button" class="tb o" id="up">${sv('<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',20)}<span>Hesap oluştur</span></button>
  </form>
  <div class="tn">${sv('<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',18)}<span>Tedarikçiysen istediğin e-postayla hesap oluştur. Giriş yaptıktan sonra işletmenin sana verdiği davet kodunu girerek bağlanırsın.</span></div><p class="tback">İşveren ya da çalışan mısın? <a href="/">Ana girişe dön</a></p></section>`;
  $('#eye').onclick=()=>{const i=$('#pw'); i.type=i.type==='password'?'text':'password';};
  $('#tfm').onsubmit=(e)=>e.preventDefault();
  ['#em','#pw'].forEach(k=>$(k).addEventListener('keydown',(e)=>{if(e.key==='Enter'){e.preventDefault();$('#in').onclick();}}));
  const cred=()=>({email:$('#em').value.trim(),password:$('#pw').value});
  $('#in').onclick=async()=>{const r=await sb.auth.signInWithPassword(cred()); if(r.error) say('Giriş olmadı: '+r.error.message); else boot();};
  $('#up').onclick=async()=>{const c=cred(); if(c.password.length<8) return say('Şifre en az 8 karakter olmalı.');
    const r=await sb.auth.signUp(c); if(r.error) return say(r.error.message);
    if(r.data.session) boot(); else say('Hesap oluşturuldu. E-postana gelen onay bağlantısına tıkla, sonra giriş yap.',true);};
}
function setupView(){
  document.body.classList.add('lg');
  const hero='<header class="th"><div class="th-in"><h1>KaisPilot Tedarik</h1></div></header>';
  app.innerHTML=hero+`<section class="tc"><h2>Davet kodunu gir</h2><p class="sub">İşletmenin sana verdiği 6 haneli kodu yaz.</p>
  <form class="tf" id="cf" autocomplete="off" novalidate>
   <div class="f"><label for="cd">Davet kodu</label><div class="ti"><input id="cd" type="text" autocapitalize="characters" autocomplete="one-time-code" maxlength="12" placeholder="Örn. A1B2C3" style="text-transform:uppercase;letter-spacing:2px"></div></div>
   <p class="err" id="msg" role="alert"></p>
   <button type="submit" class="tb p" id="cbtn">Bağlan</button>
  </form>
  <div class="tn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg><span>Kodun yoksa seninle çalışan işletmeden iste. Kod, KaisPilot'ta tedarikçi kaydında görünür.</span></div>
  <details style="margin-top:14px"><summary class="m" style="cursor:pointer">İşletme sahibi misin? İşletmeni oluştur</summary>
   <form class="tf" id="bf" autocomplete="off" style="margin-top:10px"><div class="f"><label for="bn">İşletme adı</label><div class="ti"><input id="bn" name="bn" type="text" autocomplete="off" placeholder="Örn: Çınar Kafe &amp; Fırın"></div></div><button type="submit" class="tb o" id="mk"><span>İşletme oluştur</span></button></form></details>
  <div class="tor" style="margin-top:14px"><span>${esc(ME.email||'')}</span></div><button type="button" class="tb o" id="out" style="margin-top:8px;min-height:44px"><span>Çıkış yap</span></button></section>`;
  bindOut();
  $('#cf').addEventListener('submit',async(ev)=>{ev.preventDefault();
    const code=$('#cd').value.trim().toUpperCase(); if(code.length<4) return say('Davet kodunu yaz.');
    $('#cbtn').disabled=true; say('Bağlanıyor…',true);
    const r=await sb.rpc('claim_supplier_code',{p_code:code});
    if(r.error){$('#cbtn').disabled=false; return say(/function|schema cache/i.test(r.error.message)?'Davet kodu sistemi henüz kurulmamış. İşletmeye haber ver.':r.error.message);}
    boot();});
  $('#bf').addEventListener('submit',async(ev)=>{ev.preventDefault();
    const n=String(new FormData(ev.target).get('bn')||'').trim();
    if(!n) return say('İşletme adını yaz.');
    $('#mk').disabled=true; say('Kaydediliyor…',true);
    const r=await sb.from('businesses').insert({name:n,owner_id:ME.id});
    if(r.error){$('#mk').disabled=false; say('Kaydedilemedi: '+r.error.message);} else boot();});
}
/* ---------- PATRON ---------- */
async function patronView(){
  const [sp,rf,qt,od]=await Promise.all([
    sb.from('suppliers').select('*').eq('business_id',BIZ.id).order('created_at'),
    sb.from('rfqs').select('*').eq('business_id',BIZ.id).order('created_at',{ascending:false}),
    sb.from('quotes').select('*'),
    sb.from('orders').select('*').eq('business_id',BIZ.id).order('created_at',{ascending:false})]);
  const sups=sp.data||[], rfqs=rf.data||[], quotes=qt.data||[], orders=od.data||[];
  const sn=(id)=>(sups.find(s=>s.id===id)||{}).name||'Tedarikçi';
  app.innerHTML=head(BIZ.name,'Patron paneli')+`<p class="m">Asıl yönetim ekranın <a href="/">KaisPilot</a>. Bu sayfa tedarikçiler içindir.</p>
  <div class="card"><h2>Tedarikçiler</h2>${sups.map(s=>`<div class="ln"><span>${esc(s.name)}<span class="m" style="display:block">${esc(s.invite_email||'')} · ${s.user_id?'<span class="ok">hesap bağlı</span>':'davet bekliyor'}</span></span></div>`).join('')||'<p class="m">Henüz yok.</p>'}
  <label>Tedarikçi adı</label><input id="sn" placeholder="Örn: Anadolu Un"><label>Tedarikçinin e-postası (bu e-postayla hesap açacak)</label><input id="se" type="email"><p class="err" id="msg"></p><button id="sadd">Tedarikçi ekle</button></div>
  <div class="card"><h2>Yeni teklif isteği</h2><p class="m">Hangi ürünlerden ne kadar lazım? Tedarikçiler bu listeye fiyat verecek.</p>
  <div id="rrows"></div><datalist id="pl">${[...new Set(rfqs.flatMap(r=>r.lines.map(l=>l.name)))].map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
  <div class="row" style="margin-top:8px"><button class="s sm" id="radd1" type="button">+ Ürün ekle</button></div><p class="err" id="msg2"></p><button id="radd">Teklif iste</button></div>
  <h2>Teklif istekleri</h2>${rfqs.map(r=>{const qs=quotes.filter(q=>q.rfq_id===r.id);
    const best=r.lines.map((l,i)=>{let b=null;qs.forEach(q=>{const p=Number(q.prices[i]);if(p>0&&(!b||p<b.p))b={p,s:q.supplier_id};});return b;});
    return `<div class="card"><div class="row"><b>${new Date(r.created_at).toLocaleDateString('tr-TR')}</b><span class="pill">${r.status==='acik'?'Açık':'Kapalı'}</span></div>
    ${r.lines.map((l,i)=>`<div class="ln"><span>${esc(l.name)} · ${esc(l.qty)} ${esc(l.unit)}</span><span>${best[i]?esc(sn(best[i].s))+' <b>'+tl(best[i].p)+'</b>':'<span class="m">teklif yok</span>'}</span></div>`).join('')}
    <p class="m">${qs.length} tedarikçi teklif verdi.</p>
    ${r.status==='acik'&&best.every(Boolean)?`<button data-ord="${r.id}">En ucuz dağıtımla sipariş ver</button>`:''}</div>`;}).join('')||'<p class="m">Henüz yok.</p>'}
  <div class="card"><h2>Siparişler</h2>${orders.map(o=>`<div class="ln"><span>${esc(sn(o.supplier_id))}<span class="m" style="display:block">${o.lines.map(l=>esc(l.qty)+' '+esc(l.unit)+' '+esc(l.name)).join(', ')}</span></span><span>${tl(o.total)}<span class="pill" style="display:block">${esc(o.status)}</span></span></div>`).join('')||'<p class="m">Henüz yok.</p>'}</div>`;
  bindOut();
  $('#sadd').onclick=async()=>{const n=$('#sn').value.trim(),e=$('#se').value.trim(); if(!n||!e) return say('Ad ve e-posta yaz.');
    const r=await sb.from('suppliers').insert({business_id:BIZ.id,name:n,invite_email:e}); if(r.error) say(r.error.message); else patronView();};
  const UNITS=['kg','adet','L','paket','koli','çuval','gr','kutu'];
  const addRow=(v)=>{const d=document.createElement('div');d.className='row';d.style.cssText='gap:6px;margin:6px 0;flex-wrap:nowrap';
    d.innerHTML=`<input list="pl" placeholder="Ürün adı" style="flex:3;min-width:0" class="rn"><input inputmode="decimal" placeholder="Miktar" style="flex:1.2;min-width:0" class="rq"><select class="ru" style="flex:1.3;min-width:0">${UNITS.map(u=>`<option>${u}</option>`).join('')}</select><button type="button" class="s sm rx" aria-label="Satırı sil">×</button>`;
    d.querySelector('.rx').onclick=()=>{if(document.querySelectorAll('#rrows .rn').length>1) d.remove();};
    if(v){d.querySelector('.rn').value=v.name||'';d.querySelector('.rq').value=v.qty||'';d.querySelector('.ru').value=v.unit||'kg';}
    $('#rrows').appendChild(d);};
  addRow(); addRow();
  $('#radd1').onclick=()=>addRow();
  $('#radd').onclick=async()=>{const e=$('#msg2'); const lines=[...document.querySelectorAll('#rrows .row')].map(r=>({name:r.querySelector('.rn').value.trim(),qty:Number(String(r.querySelector('.rq').value).replace(',','.')),unit:r.querySelector('.ru').value})).filter(l=>l.name&&l.qty>0);
    if(!lines.length){e.textContent='En az bir ürünün adını ve miktarını yaz.';return;}
    $('#radd').disabled=true; const r=await sb.from('rfqs').insert({business_id:BIZ.id,lines}); if(r.error){e.textContent='Kaydedilemedi: '+r.error.message;$('#radd').disabled=false;} else patronView();};
  document.querySelectorAll('[data-ord]').forEach(b=>b.onclick=async()=>{
    const r=rfqs.find(x=>x.id===b.dataset.ord), qs=quotes.filter(q=>q.rfq_id===r.id), g={};
    r.lines.forEach((l,i)=>{let bb=null;qs.forEach(q=>{const p=Number(q.prices[i]);if(p>0&&(!bb||p<bb.p))bb={p,s:q.supplier_id};});(g[bb.s]=g[bb.s]||[]).push({name:l.name,unit:l.unit,qty:l.qty,price:bb.p});});
    const rows=Object.keys(g).map(s=>({business_id:BIZ.id,supplier_id:s,lines:g[s],total:g[s].reduce((a,l)=>a+l.qty*l.price,0)}));
    const o=await sb.from('orders').insert(rows); if(o.error) return alert(o.error.message);
    await sb.from('rfqs').update({status:'kapali'}).eq('id',r.id); patronView();});
}
/* ---------- TEDARİKÇİ ---------- */
async function supView(){
  const [bz,rf,qt,od]=await Promise.all([
    sb.from('businesses').select('*').eq('id',SUP.business_id).limit(1),
    sb.from('rfqs').select('*').eq('business_id',SUP.business_id).eq('status','acik').order('created_at',{ascending:false}),
    sb.from('quotes').select('*').eq('supplier_id',SUP.id),
    sb.from('orders').select('*').eq('supplier_id',SUP.id).order('created_at',{ascending:false})]);
  const biz=(bz.data&&bz.data[0])||{name:'İşletme'}, rfqs=rf.data||[], quotes=qt.data||[], orders=od.data||[];
  app.innerHTML=head(SUP.name,'Tedarikçi paneli')+`<p class="m">${esc(biz.name)} için çalışıyorsun.</p>
  <h2>Gelen teklif istekleri</h2>${rfqs.map(r=>{const q=(quotes.find(x=>x.rfq_id===r.id)||{}).prices||{};
    return `<div class="card" data-r="${r.id}"><b>${new Date(r.created_at).toLocaleDateString('tr-TR')}</b>
    ${r.lines.map((l,i)=>`<label>${esc(l.name)} · ${esc(l.qty)} ${esc(l.unit)} için birim fiyat (₺)</label><input inputmode="decimal" data-i="${i}" value="${q[i]||''}" placeholder="Veremiyorsan boş bırak">`).join('')}
    <p class="err" data-e></p><button data-send>Teklifi gönder</button></div>`;}).join('')||'<p class="m">Açık teklif isteği yok.</p>'}
  <div class="card"><h2>Siparişler</h2>${orders.map(o=>`<div class="card" style="margin:8px 0"><div class="row"><b>${tl(o.total)}</b><span class="pill">${esc(o.status)}</span></div>${o.lines.map(l=>`<div class="ln"><span>${esc(l.name)}</span><span>${esc(l.qty)} ${esc(l.unit)} × ${tl(l.price)}</span></div>`).join('')}${o.status==='gonderildi'?`<button data-ok="${o.id}" style="margin-top:8px">Siparişi onayla</button>`:''}</div>`).join('')||'<p class="m">Henüz sipariş yok.</p>'}</div>`;
  bindOut();
  document.querySelectorAll('[data-send]').forEach(b=>b.onclick=async()=>{
    const c=b.closest('[data-r]'), prices={}; c.querySelectorAll('input').forEach(i=>{const v=Number(String(i.value).replace(',','.')); if(v>0) prices[i.dataset.i]=v;});
    const e=c.querySelector('[data-e]'); if(!Object.keys(prices).length){e.textContent='En az bir fiyat yaz.';return;}
    const r=await sb.from('quotes').upsert({rfq_id:c.dataset.r,supplier_id:SUP.id,prices},{onConflict:'rfq_id,supplier_id'});
    if(r.error) e.textContent=r.error.message; else {e.textContent='Teklif gönderildi.';e.className='err ok';}});
  document.querySelectorAll('[data-ok]').forEach(b=>b.onclick=async()=>{const r=await sb.from('orders').update({status:'onaylandi'}).eq('id',b.dataset.ok); if(r.error) alert(r.error.message); else supView();});
}
sb.auth.onAuthStateChange((ev)=>{ if(ev==='SIGNED_OUT') loginView(); });
boot();
</script></body></html>
