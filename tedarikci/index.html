function spStk(p,R){R=R||spRes(); const qty=Number(p.qty)||0; const res=(R[p.id]||[]).reduce((a,r)=>a+r.qty,0); const avail=qty-res; const vel=spVel(p.id); const cover=vel>0?Math.max(0,avail)/vel:null; const min=Number(p.min_stock)||0;

function spVehCard(){const v=spVeh(); const kc=spKmCost(v); const m=spMargin();
  return `<div class="sp-sec-h"><h2>Araç ve teslimat maliyeti</h2></div><div class="sp-card"><p class="sp-d">Siparişin teslimata değip değmediğini hesaplamak için. Bu bilgi sadece sende kalır, işletme görmez.</p>
  <label>Araç</label><input id="vh-name" value="${esc(v.name)}" placeholder="Örn: Renault Master"><div class="sp-two2"><div><label>Yakıt</label><select id="vh-fuel">${[['dizel','Dizel'],['benzin','Benzin'],['lpg','LPG'],['hibrit','Hibrit'],['elektrik','Elektrik']].map(o=>`<option value="${o[0]}" ${v.fuel===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div><div><label>Tüketim (L/100 km)</label><input id="vh-l" inputmode="decimal" value="${v.l100||''}" placeholder="9,5"></div></div>
  <div class="sp-two2"><div><label>Yakıt fiyatı (₺/L)</label><input id="vh-fp" inputmode="decimal" value="${v.fp||''}" placeholder="Pompa fiyatı"></div><div><label>Aşınma (₺/km)</label><input id="vh-wear" inputmode="decimal" value="${v.wear||''}" placeholder="Bakım, lastik"></div></div>
  <div class="sp-two2"><div><label>Sürücü (₺/saat)</label><input id="vh-drv" inputmode="decimal" value="${v.drv||''}" placeholder="0"></div><div><label>Ortalama hız (km/s)</label><input id="vh-spd" inputmode="decimal" value="${v.spd||40}"></div></div>
  <label>Minimum teslimat tutarı (₺)</label><input id="vh-min" inputmode="decimal" value="${v.minD||''}" placeholder="Bunun altında teslimat yapmam"><p class="sp-d" id="vh-pv">${spVehPrev(v,m)}</p><p class="err" id="vh-err"></p><button class="sp-pri sp-wide" data-sp="vsave">Araç bilgisini kaydet</button></div>`;}
function spVehPrev(v,m){const kc=spKmCost(v); if(!spVehOK(v)) return 'Tüketim ve yakıt fiyatını yazınca km maliyetin burada görünür.'; return 'Km başına maliyetin: <b>'+tl(kc)+'</b>'+(v.drv>0?' + saatte '+tl(v.drv)+' sürücü':'')+'. 20 km uzağa gidiş-dönüş yakıt ve aşınma: <b>'+tl(40*kc)+'</b>.';}
function spVehRead(){const n=(id)=>nz($v(id)); return {name:$v('vh-name')||'',fuel:$v('vh-fuel')||'dizel',l100:n('vh-l'),fp:n('vh-fp'),wear:n('vh-wear'),drv:n('vh-drv'),spd:n('vh-spd')||40,minD:n('vh-min')};}
document.addEventListener('input',e=>{const t=e.target; if(t&&/^vh-/.test(t.id||'')){const o=document.getElementById('vh-pv'); if(o) o.innerHTML=spVehPrev(spVehRead(),spMargin());}});
SPA.vsave=async(el)=>{if(SPS.busy) return; const veh=spVehRead(); const e=document.getElementById('vh-err'); if(veh.spd<5||veh.spd>130){if(e) e.textContent='Ortalama hız 5 ile 130 arasında olmalı.'; return;} SPS.busy=true; el.disabled=true; const r=await sb.from('supplier_private').upsert({supplier_id:SUP.id,vehicle:veh,updated_at:new Date().toISOString()},{onConflict:'supplier_id'}); SPS.busy=false; el.disabled=false;
  if(spDb(r)){if(e) e.textContent=/vehicle|schema cache|supplier_private|relation/i.test(spDb(r))?'Kurulum eksik. kaispilot_teslimat.sql dosyasını çalıştır.':spDb(r); return;} SPS.prof=Object.assign({},SPS.prof,{vehicle:veh}); spToast('Araç bilgisi kaydedildi.'); spRender(true);};

/* ---- eksik teslim: kabul / itiraz ---- */
function spRecvHTML(o){ if(!(o.recv&&o.recv.short>0)) return ''; const st=o.recv_status||'bekliyor'; const WHY={eksik:'Eksik geldi',hasar:'Hasarlı / bozuk',yanlis:'Yanlış ürün',skt:'SKT çok kısa'};
  const rows=(o.recv.rows||[]).map(r=>`<div class="sp-ol"><span>${esc(r.name)} <em class="sp-b mut">${esc(WHY[r.why]||'Sorun')}</em></span><span>${esc(r.got)} / ${esc(r.ord)} ${esc(r.unit)}</span></div>`).join('');
  const head=st==='kabul'?['Kabul ettin','ok']:st==='itiraz'?['İtiraz ettin','bad']:['Cevap bekliyor','warn'];
  return `<div class="sp-card sp-rc"><div class="sp-ch"><b>Eksik teslim bildirimi</b><span class="sp-b ${head[1]}">${head[0]}</span></div><p class="sp-d">${esc(bizName(o.business_id))} ${tl(o.recv.short)} düşülmesini istiyor.${o.recv.note?' Not: '+esc(o.recv.note):''}</p>${rows}
  ${st==='bekliyor'?`<div class="sp-two" style="margin-top:10px"><button class="sp-sec bad" data-sp="ritiraz" data-id="${o.id}">İtiraz et</button><button class="sp-pri" data-sp="rkabul" data-id="${o.id}">Kabul et</button></div><p class="sp-d">Kabul edersen ${tl(o.recv.short)} cariden düşülür.</p>`:''}${st==='itiraz'&&o.recv_reply?`<p class="sp-d">Cevabın: ${esc(o.recv_reply)}</p>`:''}</div>`;}
SPA.rkabul=async(el)=>{const o=SPS.orders.find(x=>x.id===el.dataset.id); if(!o||!o.recv) return; const r=await sb.from('orders').update({recv_status:'kabul'}).eq('id',o.id); if(spDb(r)) return spToast(/recv_status|schema cache/i.test(spDb(r))?'Kurulum eksik. kaispilot_mutabakat.sql dosyasını çalıştır.':spDb(r),1);
  o.recv_status='kabul'; const sh=Number(o.recv.short)||0; const c=SPS.books.cari.find(x=>x.orderId===o.id&&!x.paid); if(c&&c.amt>=sh){c.amt=Math.round((c.amt-sh)*100)/100; c.note=(c.note||'')+' (eksik teslim düşüldü)';} else SPS.books.cari.push({id:bid(),kind:'borc',who:bizName(o.business_id),amt:sh,due:isoToday(),note:'Alacak notu: eksik teslim',paid:false,orderId:o.id+'-cn'}); spSaveBooks(); spNotify(o,'eksik_kabul'); spToast('Kabul edildi, '+tl(sh)+' cariden düşüldü.'); spRender(true);};
SPA.ritiraz=(el)=>{SPS.sheet={t:'ritiraz',id:el.dataset.id}; spRender(true);};
SPA.ritsend=async()=>{const o=SPS.orders.find(x=>x.id===SPS.sheet.id); if(!o) return; const note=($v('rt-n')||'').slice(0,200); const r=await sb.from('orders').update({recv_status:'itiraz',recv_reply:note||null}).eq('id',o.id); if(spDb(r)) return spErr(/recv_status|schema cache/i.test(spDb(r))?'Kurulum eksik. kaispilot_mutabakat.sql dosyasını çalıştır.':spDb(r)); o.recv_status='itiraz'; o.recv_reply=note; SPS.sheet=null; spNotify(o,'eksik_itiraz'); spToast('İtirazın iletildi.'); spRender(true);};
const _spSheet2=spSheet;
spSheet=function(){const s=SPS.sheet; if(s.t!=='ritiraz') return _spSheet2(); const o=SPS.orders.find(x=>x.id===s.id)||{}; return `<div class="sp-ov" data-sp="sclose"><div class="sp-sh"><div class="sp-shh"><h3>Eksik teslime itiraz</h3><button data-sp="sclose" aria-label="Kapat">${SPI('x',20)}</button></div><p class="sp-d">${esc(bizName(o.business_id))} için ${tl((o.recv||{}).short||0)} düşülmesine itiraz ediyorsun. Kısa bir sebep yaz, işletme görecek.</p><label>Sebep</label><input id="rt-n" placeholder="Örn: Teslimatta imzalı, eksik görünmüyor"><p class="err" id="msg"></p><button class="sp-pri sp-wide" data-sp="ritsend">İtirazı gönder</button></div></div>`;};

/* ---- cari mutabakat ---- */
const RC_ST={bekliyor:['Onay bekliyor','warn'],onaylandi:['Onaylandı','ok'],itiraz:['İtiraz var','bad']};
function rcCompute(orders,pays,period){const end=period+'-31'; const L=[]; let dis=0;
  orders.filter(o=>['onaylandi','teslim'].includes(o.status)&&(o.created_at||'').slice(0,10)<=end).forEach(o=>{const d=(o.created_at||'').slice(0,10); L.push({d,t:'Sipariş · '+(o.lines||[]).length+' kalem',a:Number(o.total)||0}); if(o.recv&&o.recv.short>0){if(o.recv_status==='kabul') L.push({d,t:'Alacak notu (eksik teslim)',a:-Number(o.recv.short)}); else dis+=Number(o.recv.short);}});
  pays.filter(p=>String(p.pay_date||'')<=end).forEach(p=>L.push({d:String(p.pay_date),t:'Ödeme'+(p.note?' · '+p.note:''),a:-Number(p.amt),pay:true,by:p.by_side}));
  L.sort((a,b)=>a.d>b.d?1:-1); const carried=L.filter(x=>x.d.slice(0,7)<period).reduce((a,x)=>a+x.a,0); const lines=L.filter(x=>x.d.slice(0,7)===period); const bal=Math.round(L.reduce((a,x)=>a+x.a,0)*100)/100; return {lines,carried:Math.round(carried*100)/100,bal,dis};}
const rcMonL=(p)=>{const a=p.split('-'); return ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'][Number(a[1])-1]+' '+a[0];};
const rcShift=(p,n)=>{const a=p.split('-').map(Number); const d=new Date(Date.UTC(a[0],a[1]-1+n,1)); return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0');};
function rcOrders(sid){return SPS.orders.filter(o=>o.supplier_id===sid);}
function rcPays(sid){return (SPS.pays||[]).filter(p=>p.supplier_id===sid);}
function spRcCard(){const rows=(SPS.sups||[]); if(!rows.length||!SPS.orders.length) return ''; const per=isoToday().slice(0,7);
  return `<div class="sp-card"><div class="sp-ch"><b>Cari mutabakat</b></div><p class="sp-d">Ay sonunda ekstreyi işletmeyle onaylayın. Fark çıkarsa satır satır bakılır.</p>${rows.map(r=>{const c=rcCompute(rcOrders(r.id),rcPays(r.id),per); const rec=(SPS.recons||[]).find(x=>x.supplier_id===r.id&&x.period===per); const st=rec?RC_ST[rec.status]:null; const wait=rec&&rec.status==='bekliyor'&&rec.sent_by==='isletme';
    return `<button class="sp-rcrow" data-sp="rcopen" data-id="${r.id}"><div><b>${esc(bizName(r.business_id))}</b><span>Bakiye ${tl(c.bal)} · ${rcMonL(per)}</span></div>${wait?'<em class="sp-b warn">Senden onay bekliyor</em>':st?`<em class="sp-b ${st[1]}">${st[0]}</em>`:'<em class="sp-b mut">Gönderilmedi</em>'}</button>`;}).join('')}</div>`;}
const _spMCari=spMCari; spMCari=function(){return spRcCard()+_spMCari();};
async function rcLoad(){const R=SPS.rc; const [py,rc]=await Promise.all([sb.from('cari_pay').select('*').eq('supplier_id',R.sid),sb.from('cari_recon').select('*').eq('supplier_id',R.sid)]); if(!py.error) SPS.pays=(SPS.pays||[]).filter(x=>x.supplier_id!==R.sid).concat(py.data||[]); if(!rc.error) SPS.recons=(SPS.recons||[]).filter(x=>x.supplier_id!==R.sid).concat(rc.data||[]); spRender(true);}
SPA.rcopen=(el)=>{const r=SPS.sups.find(x=>x.id===el.dataset.id); if(!r) return; SPS.rc={sid:r.id,bid:r.business_id,period:isoToday().slice(0,7)}; SPS.sheet={t:'ekstre'}; spRender(true); rcLoad();};
SPA.rcmon=(el)=>{SPS.rc.period=rcShift(SPS.rc.period,Number(el.dataset.v)); spRender(true);};
const rcRec=()=>(SPS.recons||[]).find(x=>x.supplier_id===SPS.rc.sid&&x.period===SPS.rc.period);
function rcNotify(){const o=rcOrders(SPS.rc.sid)[0]; if(o) spNotify(o,'ekstre');}
SPA.rcsend=async()=>{const R=SPS.rc; const c=rcCompute(rcOrders(R.sid),rcPays(R.sid),R.period); const row={business_id:R.bid,supplier_id:R.sid,period:R.period,bal:c.bal,sent_by:'toptanci',status:'bekliyor',note:null,updated_at:new Date().toISOString()}; const r=await sb.from('cari_recon').upsert(row,{onConflict:'supplier_id,period'}); if(spDb(r)) return spToast(/cari_recon|relation|schema cache/i.test(spDb(r))?'Kurulum eksik. kaispilot_mutabakat.sql dosyasını çalıştır.':spDb(r),1); SPS.recons=(SPS.recons||[]).filter(x=>!(x.supplier_id===R.sid&&x.period===R.period)); SPS.recons.push(Object.assign({id:'n'},row)); rcNotify(); spToast('Ekstre işletmeye gönderildi.'); spRender(true);};
SPA.rcok=async()=>{const R=SPS.rc, rec=rcRec(); if(!rec) return; const r=await sb.from('cari_recon').update({status:'onaylandi',note:null,updated_at:new Date().toISOString()}).eq('supplier_id',R.sid).eq('period',R.period); if(spDb(r)) return spToast(spDb(r),1); rec.status='onaylandi'; rcNotify(); spToast('Ekstre onaylandı.'); spRender(true);};
SPA.rcno=async()=>{const R=SPS.rc, rec=rcRec(); if(!rec) return; const note=($v('rc-n')||'').slice(0,200); const r=await sb.from('cari_recon').update({status:'itiraz',note:note||null,updated_at:new Date().toISOString()}).eq('supplier_id',R.sid).eq('period',R.period); if(spDb(r)) return spToast(spDb(r),1); rec.status='itiraz'; rec.note=note; rcNotify(); spToast('İtirazın iletildi.'); spRender(true);};
SPA.rcpay=async()=>{const R=SPS.rc; const amt=nz($v('rc-a')); if(!(amt>0)) return spToast('Ödeme tutarını yaz.',1); const row={business_id:R.bid,supplier_id:R.sid,amt,pay_date:isoToday(),note:($v('rc-pn')||'').slice(0,80)||null,by_side:'toptanci'}; const r=await sb.from('cari_pay').insert(row); if(spDb(r)) return spToast(/cari_pay|relation|schema cache/i.test(spDb(r))?'Kurulum eksik. kaispilot_mutabakat.sql dosyasını çalıştır.':spDb(r),1); SPS.pays=(SPS.pays||[]).concat([Object.assign({id:'p'+Date.now()},row)]); spToast('Ödeme kaydedildi.'); spRender(true);};
const _spSheet3=spSheet;
spSheet=function(){const s=SPS.sheet; if(s.t!=='ekstre') return _spSheet3(); const R=SPS.rc; const c=rcCompute(rcOrders(R.sid),rcPays(R.sid),R.period); const rec=rcRec(); const st=rec?RC_ST[rec.status]:null; const mine=rec&&rec.sent_by==='toptanci'; const other=rec&&rec.sent_by==='isletme'; const diff=other?Math.round((c.bal-rec.bal)*100)/100:0;
  const body=`<div class="sp-mon"><button data-sp="rcmon" data-v="-1" aria-label="Önceki ay">‹</button><b>${rcMonL(R.period)}</b><button data-sp="rcmon" data-v="1" aria-label="Sonraki ay">›</button></div>
  <div class="sp-ecl"><span>Devreden</span><span>${tl(c.carried)}</span></div>${c.lines.map(x=>`<div class="sp-ecl"><span>${esc(x.d.slice(8))}.${esc(x.d.slice(5,7))} ${esc(x.t)}${x.by?' <em class="sp-b mut">'+(x.by==='isletme'?'işletme':'sen')+'</em>':''}</span><span>${x.a<0?'−':''}${tl(Math.abs(x.a))}</span></div>`).join('')||'<p class="sp-d">Bu ay hareket yok.</p>'}
  <div class="sp-ecl tot"><span>Dönem sonu bakiye (işletme sana borçlu)</span><span>${tl(c.bal)}</span></div>${c.dis>0?`<p class="sp-ecn">${tl(c.dis)} tutarındaki eksik teslim tartışmalı, bakiyeye düşülmedi.</p>`:''}
  ${st?`<div class="sp-tip ${st[1]==='ok'?'ok':st[1]==='bad'?'warn':''}"><p><b>${st[0]}</b><br>${mine?'Sen gönderdin: '+tl(rec.bal):'İşletme gönderdi: '+tl(rec.bal)}${rec.note?'<br>Not: '+esc(rec.note):''}${other&&Math.abs(diff)>=0.5?'<br>Senin kaydınla fark: '+tl(Math.abs(diff)):''}</p></div>`:''}
  ${rec&&rec.status==='onaylandi'?'':other&&rec.status==='bekliyor'?(Math.abs(diff)<0.5?'<button class="sp-pri sp-wide" data-sp="rcok">Onayla</button>':'<p class="sp-d">Bakiyeler farklı. Farkı bulup düzelt ya da itiraz et.</p>')+'<label>İtiraz sebebi</label><input id="rc-n" placeholder="Örn: 12.11 tarihli ödeme eksik"><button class="sp-sec sp-wide bad" data-sp="rcno">İtiraz et</button>':`<button class="sp-pri sp-wide" data-sp="rcsend">${rec?'Yeniden gönder':'İşletmeye onaya gönder'}</button>`}
  <h3 class="sp-h" style="margin-top:14px">Ödeme ekle</h3><div class="sp-two2"><div><label>Tutar (₺)</label><input id="rc-a" inputmode="decimal"></div><div><label>Not</label><input id="rc-pn" placeholder="Havale, nakit"></div></div><button class="sp-sec sp-wide" data-sp="rcpay">Ödemeyi kaydet</button>`;
  return `<div class="sp-ov" data-sp="sclose"><div class="sp-sh"><div class="sp-shh"><h3>${esc(bizName(R.bid))} ekstresi</h3><button data-sp="sclose" aria-label="Kapat">${SPI('x',20)}</button></div>${body}</div></div>`;};

/* ---- WhatsApp'ta anlaştıktan sonra toptancının sipariş hazırlaması ---- */
SP_OST.taslak=['İşletme onayı bekliyor','warn'];
const spTierPct=(p,q)=>{const t=(p.tiers||[]).filter(x=>q>=Number(x.q)).sort((a,b)=>b.q-a.q)[0]; return t?Number(t.p):0;};
const spUnitPrice=(p,q)=>{const pr=(typeof unitLeft==='function'&&unitLeft(p))?p.price*(1-p.promo_pct/100):p.price; return Math.round(pr*(1-spTierPct(p,q)/100)*100)/100;};
SPA.sipnew=()=>{SPS.sheet={t:'sipnew',bid:(SPS.sups[0]||SUP).business_id,q:''}; spRender(true);};
SPA.sipbiz=(el)=>{SPS.sheet.bid=el.value; };
const _spSheet4=spSheet;
spSheet=function(){const s=SPS.sheet; if(s.t!=='sipnew') return _spSheet4(); const L=SPS.prods.filter(p=>p.active!==false&&p.stock!=='yok');
  const body=`<p class="sp-d">WhatsApp'ta anlaştığın siparişi buradan işletme adına hazırla. İşletme onaylayınca siparişe dönüşür.</p>
  ${(SPS.sups||[]).length>1?`<label>İşletme</label><select id="sn-b">${SPS.sups.map(r=>`<option value="${esc(r.business_id)}" ${r.business_id===s.bid?'selected':''}>${esc(bizName(r.business_id))}</option>`).join('')}</select>`:`<p class="sp-d"><b>${esc(bizName(s.bid))}</b></p>`}
  <label>Ürünler (miktar yaz)</label><div class="sp-snl">${L.map(p=>`<div class="sp-snr"><span>${esc(p.name)}<em>${tl(p.price)} / ${esc(p.unit)}</em></span><input class="sn-q" data-id="${p.id}" inputmode="decimal" placeholder="0" aria-label="${esc(p.name)} miktarı"></div>`).join('')||'<p class="sp-d">Satışta ürün yok.</p>'}</div>
  <label>Not</label><input id="sn-n" placeholder="Örn: Cuma sabahı teslim"><p class="err" id="msg"></p><button class="sp-pri sp-wide" data-sp="snsave">İşletmeye gönder</button>`;
  return `<div class="sp-ov" data-sp="sclose"><div class="sp-sh"><div class="sp-shh"><h3>Sipariş hazırla</h3><button data-sp="sclose" aria-label="Kapat">${SPI('x',20)}</button></div>${body}</div></div>`;};
SPA.snsave=async(el)=>{if(SPS.busy) return; const bid=($v('sn-b')||SPS.sheet.bid); const lines=[]; document.querySelectorAll('.sn-q').forEach(i=>{const q=nz(i.value); if(q>0){const p=SPS.prods.find(x=>x.id===i.dataset.id); if(p) lines.push({name:p.name,qty:q,unit:p.unit,price:spUnitPrice(p,q)});}}); if(!lines.length) return spErr('En az bir ürünün miktarını yaz.');
  const total=Math.round(lines.reduce((a,l)=>a+l.qty*l.price,0)*100)/100; const note=($v('sn-n')||'').slice(0,120); SPS.busy=true; el.disabled=true;
  const row={business_id:bid,supplier_id:supIdFor(bid),lines,total,status:'taslak'}; const r=await sb.from('orders').insert(row).select(); SPS.busy=false; el.disabled=false;
  if(spDb(r)) return spErr(/check|policy|violates/i.test(spDb(r))?'Kurulum eksik. kaispilot_siparis.sql dosyasını çalıştır.':spDb(r));
  const o=(Array.isArray(r.data)?r.data[0]:r.data)||{}; const full=Object.assign({id:'n'+Date.now(),created_at:new Date().toISOString()},row,o); SPS.orders.unshift(full); SPS.sheet=null; if(o.id) spNotify(full,'taslak'); spToast('Sipariş işletmeye gönderildi.'); spRender(true);};

if(DEMO){ME={id:'demo'};SUP={id:'s1',business_id:'b1',name:'Anadolu Un (deneme)'};MODE='sup';supView();}else boot();
</script></body></html>
