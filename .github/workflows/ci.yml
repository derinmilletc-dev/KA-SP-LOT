name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JS sozdizimi (index.html ve admin)
        run: |
          mkdir -p /tmp/chk
          for f in index.html admin/index.html rez/index.html; do
            node -e "
              const fs=require('fs');const h=fs.readFileSync('$f','utf8');
              const re=/<script(?![^>]*src)(?![^>]*type=\"(?:application|text)\/(?:json|template))[^>]*>([\s\S]*?)<\/script>/g;let m,i=0;
              while((m=re.exec(h)))fs.writeFileSync('/tmp/chk/'+'$f'.replace(/\//g,'_')+'_'+(i++)+'.js',m[1]);"
          done
          for j in /tmp/chk/*.js; do echo "check $j"; node --check "$j"; done
      - name: Uygulama dosyalari (js/app-*.js) sozdizimi, ozet ve mukerrer kontrolu
        run: |
          for f in js/app-*.js; do echo "check $f"; node --check "$f"; done
          python3 tools/stamp.py --check
          npm i --no-save acorn@8 >/dev/null 2>&1
          node tools/check_dups.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Duman testi
        run: python3 tests/smoke.py
      - name: Sube kisiti (istemci)
        run: python3 tests/branch_client.py
      - name: Kismi tahsilat ve odeme
        run: python3 tests/partial.py
      - name: Cevrimdisi kuyruk ve birlestirme
        run: python3 tests/offline.py
      - name: Hesap plani, mizan, bilanco
        run: python3 tests/accounting.py
      - name: Plan bandi ve salt okunur mod
        run: python3 tests/plan_client.py
      - name: Uctan uca akislar (fis, izin, talep, ariza, gorev, fatura, borc, stok)
        run: |
          python3 tests/flows.py
          python3 tests/flows2.py
          python3 tests/signup.py
          python3 tests/ai_actions.py
          python3 tests/slowload.py
      - name: Disari aktarmalar (Excel, CSV, yedek)
        run: |
          pip install openpyxl pillow
          python3 tests/exports.py
      - name: Fis tarama (OCR) uctan uca
        run: python3 tests/ocr_flow.py
      - name: Yerel kutuphaneler + CSP (Excel, PDF, OCR)
        run: python3 tests/vendor_csp.py
      - name: Gmail baglantisi (istemci)
        run: python3 tests/gmail_client.py
      - name: E-posta gönderme (istemci)
        run: python3 tests/send_client.py
      - name: Para birimi ve fiş KDV (istemci)
        run: python3 tests/currency_client.py
      - run: python3 tests/excel_kasa.py
      - run: python3 tests/import_pay.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gmail baglantisi (sunucu fonksiyonu, sahte Google)
        run: node --experimental-strip-types supabase/test_mail.mjs
      - name: kais-send testleri
        run: node --experimental-strip-types supabase/test_send.mjs
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pg
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: pg
    steps:
      - uses: actions/checkout@v4
      - name: Sema + sube yetkisi testi
        run: |
          createdb kt
          for f in supabase/tests/stub.sql supabase/sql/00_base_schema.sql supabase/sql/branch_scope.sql supabase/tests/branch_scope_test.sql; do
            echo "== $f"; psql -v ON_ERROR_STOP=1 -q kt -f "$f"
          done
          createdb kt2
          for f in supabase/tests/stub.sql supabase/sql/00_base_schema.sql supabase/sql/plans.sql supabase/tests/plans_test.sql; do
            echo "== $f"; psql -v ON_ERROR_STOP=1 -q kt2 -f "$f"
          done
          createdb kt3
          for f in supabase/tests/stub.sql supabase/sql/00_base_schema.sql supabase/sql/mail_gmail.sql supabase/sql/mail_send.sql supabase/tests/mail_gmail_test.sql; do
            echo "== $f"; psql -v ON_ERROR_STOP=1 -q kt3 -f "$f"
          done
